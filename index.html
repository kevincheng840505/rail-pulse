<meta name="description" content="全台鐵道 3D 即時動態：選一列車，跟著它穿過山海與城市。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&family=JetBrains+Mono:wght@500;700&display=swap">

<style>
/* 沉浸式：全幅 3D 地圖，介面只留角落的小元件，選一列車後鏡頭跟著它 */
:root {
  --ink:#EEF3F6; --muted:#A3B1BC; --faint:#6E7D89;
  --glass:rgba(10,16,24,.58); --glass-strong:rgba(10,16,24,.82); --line:rgba(238,243,246,.14);
  --accent:#F2C46D; --hsr:#F07F1F; --ok:#5EE0A0; --bad:#FF7A6B;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-display:"Noto Serif TC","Songti TC",serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden] { display:none !important; }
html, body { height:100%; margin:0; }
body { background:#070C12; color:var(--ink); font-family:var(--font-body); overflow:hidden; -webkit-font-smoothing:antialiased; }
#map { position:fixed; inset:0; }
button, input { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.glass { background:var(--glass); backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2); border:1px solid var(--line); }

/* 角落元件 */
#brand { position:fixed; top:calc(env(safe-area-inset-top,0px) + 16px); left:max(16px, env(safe-area-inset-left,0px)); z-index:5; pointer-events:none; text-shadow:0 1px 12px rgba(0,0,0,.6); }
#brand h1 { margin:0; font-family:var(--font-display); font-weight:900; font-size:22px; letter-spacing:.18em; }
#brand .clock { font-family:var(--font-mono); font-size:13px; color:var(--muted); margin-top:4px; letter-spacing:.06em; }
#brand .clock b { color:var(--ink); font-weight:700; }
#tools { position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); right:max(14px, env(safe-area-inset-right,0px)); z-index:5; display:flex; gap:8px; }
.ib { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-size:16px; border:1px solid var(--line); background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
.ib[aria-pressed="true"] { background:var(--accent); color:#1B1408; border-color:transparent; }

/* 底部：選車與時間 */
#dock { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 18px); z-index:5; display:flex; gap:8px; align-items:center; }
.pillbtn { height:46px; padding:0 20px; border-radius:999px; font-weight:700; font-size:15px; letter-spacing:.04em; border:1px solid var(--line); background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); display:flex; align-items:center; gap:8px; white-space:nowrap; }
.pillbtn.primary { background:var(--ink); color:#0B1118; border-color:transparent; }
.pillbtn.small { height:40px; padding:0 14px; font-size:13px; font-family:var(--font-mono); }
.pillbtn[aria-pressed="true"] { background:var(--accent); color:#1B1408; border-color:transparent; }

/* 跟車字卡 */
#caption { position:fixed; left:max(16px, env(safe-area-inset-left,0px)); bottom:calc(env(safe-area-inset-bottom,0px) + 84px); z-index:4; width:min(380px, calc(100% - 32px)); box-sizing:border-box;
  border-radius:18px; padding:16px 18px 14px; transition:opacity .6s ease, transform .6s ease; }
#caption.fade { opacity:0; transform:translateY(8px); }
#caption .kicker { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); letter-spacing:.08em; }
#caption .dot { width:10px; height:10px; border-radius:50%; flex:none; box-shadow:0 0 12px currentColor; }
#caption h2 { margin:6px 0 2px; font-family:var(--font-display); font-weight:900; font-size:28px; letter-spacing:.06em; line-height:1.15; text-wrap:balance; }
#caption .route { color:var(--muted); font-size:14px; }
#caption .next { display:flex; justify-content:space-between; align-items:baseline; margin-top:12px; gap:12px; }
#caption .next .lab { font-size:12px; color:var(--muted); }
#caption .next b { font-size:19px; }
#caption .next .eta { font-family:var(--font-mono); font-size:15px; color:var(--accent); white-space:nowrap; }
#caption .bar { height:3px; background:var(--line); border-radius:3px; margin-top:12px; overflow:hidden; }
#caption .bar i { display:block; height:100%; background:var(--accent); border-radius:3px; transition:width 1s linear; }
#caption .meta { display:flex; justify-content:space-between; font-size:11.5px; color:var(--faint); margin-top:6px; font-family:var(--font-mono); }
#caption .late { color:var(--bad); }
#caption .ok { color:var(--ok); }

/* 選車抽屜 */
#picker { position:fixed; inset:auto 0 0 0; margin:0 auto; z-index:20; width:min(560px, 100%); max-height:72%; display:flex; flex-direction:column; border-radius:22px 22px 0 0;
  background:var(--glass-strong); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); border:1px solid var(--line); border-bottom:0;
  padding:16px max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px, env(safe-area-inset-left,0px)); box-sizing:border-box; }
#scrim { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:19; }
#picker header { display:flex; align-items:center; gap:10px; }
#picker h3 { margin:0; font-family:var(--font-display); font-size:20px; letter-spacing:.08em; flex:1; }
#pq { width:100%; box-sizing:border-box; margin-top:12px; border:1px solid var(--line); background:rgba(255,255,255,.06); border-radius:12px; padding:10px 12px; font-size:15px; }
.tabs { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.tabs button { border:1px solid var(--line); background:transparent; border-radius:999px; padding:5px 12px; font-size:13px; color:var(--muted); }
.tabs button[aria-pressed="true"] { background:var(--ink); color:#0B1118; border-color:transparent; }
#plist { overflow:auto; margin-top:10px; min-height:0; flex:1; -webkit-overflow-scrolling:touch; }
#plist button { display:grid; grid-template-columns:12px auto 1fr auto; gap:10px; align-items:center; width:100%; text-align:left; border:0; background:transparent; padding:11px 8px; border-radius:12px; border-bottom:1px solid var(--line); }
#plist button:hover { background:rgba(255,255,255,.06); }
#plist .c { width:10px; height:10px; border-radius:50%; }
#plist .n { font-weight:700; white-space:nowrap; }
#plist .d { color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
#plist .s { font-family:var(--font-mono); font-size:12px; color:var(--faint); white-space:nowrap; }
#plist .empty { color:var(--muted); padding:20px 8px; font-size:14px; }

/* 設定 */
#settings { position:fixed; top:calc(env(safe-area-inset-top,0px) + 64px); right:max(14px, env(safe-area-inset-right,0px)); z-index:21; width:min(340px, calc(100% - 28px)); box-sizing:border-box; border-radius:18px; padding:16px; background:var(--glass-strong); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); border:1px solid var(--line); max-height:calc(100% - 100px); overflow:auto; }
#settings h4 { margin:0 0 8px; font-size:12px; letter-spacing:.12em; color:var(--muted); font-weight:700; }
#settings section + section { margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
#settings label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; }
#settings input { width:100%; box-sizing:border-box; border:1px solid var(--line); background:rgba(255,255,255,.06); border-radius:10px; padding:8px 10px; font-size:14px; }
#settings .row { display:flex; gap:6px; flex-wrap:wrap; }
#settings .row button { border:1px solid var(--line); background:transparent; border-radius:10px; padding:6px 10px; font-size:13px; }
#settings .row button[aria-pressed="true"], #settings .row button.primary { background:var(--ink); color:#0B1118; border-color:transparent; }
#settings .note { font-size:12px; color:var(--muted); line-height:1.6; margin-top:8px; }
#settings .note a { color:var(--accent); }
#tdxstatus { font-size:12.5px; margin-top:8px; padding:8px 10px; border-radius:10px; background:rgba(255,255,255,.06); line-height:1.6; }
#slider { width:100%; accent-color:var(--accent); margin-top:6px; }

/* 開場 */
#intro { position:fixed; inset:0; z-index:30; display:grid; place-items:center; background:radial-gradient(ellipse at 50% 60%, rgba(7,12,18,.35), rgba(7,12,18,.88)); transition:opacity 1.2s ease; padding:24px; box-sizing:border-box; }
#intro.out { opacity:0; pointer-events:none; }
#intro .in { text-align:center; max-width:520px; }
#intro h2 { margin:0; font-family:var(--font-display); font-weight:900; font-size:clamp(40px, 11vw, 72px); letter-spacing:.24em; padding-left:.24em; text-shadow:0 2px 30px rgba(0,0,0,.5); }
#intro p { color:var(--muted); font-size:15px; line-height:1.9; margin:14px 0 26px; }
#intro .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
#intro small { display:block; color:var(--faint); font-size:12px; margin-top:22px; }

/* 車站浮窗 */
.maplibregl-popup-content { background:var(--glass-strong) !important; color:var(--ink); border-radius:14px !important; padding:12px 14px !important; border:1px solid var(--line); backdrop-filter:blur(16px); min-width:220px; font-family:var(--font-body); box-shadow:0 10px 30px rgba(0,0,0,.4) !important; }
.maplibregl-popup-tip { display:none; }
.maplibregl-popup-close-button { color:var(--muted); font-size:18px; right:6px; top:4px; }
#caption .caprow { margin-top:10px; display:flex; gap:8px; }
.pop h5 { margin:0 0 2px; font-size:16px; font-family:var(--font-display); letter-spacing:.06em; }
.pop .sys { font-size:11.5px; color:var(--muted); margin-bottom:8px; }
.pop button { display:grid; grid-template-columns:auto auto 1fr auto; gap:8px; align-items:center; width:100%; border:0; background:transparent; padding:6px 2px; text-align:left; font-size:13px; border-top:1px solid var(--line); }
.pop button:hover { color:var(--accent); }
.pop .t { font-family:var(--font-mono); font-weight:700; }
.pop .cd { font-family:var(--font-mono); font-size:12px; color:var(--muted); }
.pop .c { width:8px; height:8px; border-radius:50%; }
.maplibregl-ctrl-attrib { background:rgba(10,16,24,.5) !important; color:var(--faint) !important; font-size:10px; }
.maplibregl-ctrl-attrib a { color:var(--muted) !important; }
.maplibregl-ctrl-bottom-right { bottom:calc(env(safe-area-inset-bottom,0px) + 0px); }

@media (max-width: 640px) {
  #brand h1 { font-size:18px; }
  #caption { bottom:calc(env(safe-area-inset-bottom,0px) + 78px); left:12px; width:calc(100% - 24px); padding:12px 14px; }
  #caption h2 { font-size:22px; }
  .pillbtn { height:42px; padding:0 14px; font-size:14px; }
  .pillbtn.small { padding:0 10px; }
  #dock { width:calc(100% - 24px); justify-content:center; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }

<div id="map" aria-label="全台鐵道 3D 地圖"></div>

<div id="brand"><h1>鐵道脈動</h1><div class="clock"><b id="clock">--:--</b> <span id="mode">班表推估</span></div></div>

<div id="tools">
  <button class="ib" id="musicbtn" aria-pressed="false" title="背景音樂" aria-label="背景音樂">♪</button>
  <button class="ib" id="overview" title="回到全台" aria-label="回到全台">◎</button>
  <button class="ib" id="fullbtn" title="全螢幕（F）" aria-label="全螢幕">⤢</button>
  <button class="ib" id="setbtn" title="設定" aria-label="設定">⚙</button>
</div>

<section id="caption" class="glass fade" aria-live="polite" hidden></section>

<div id="dock">
  <button class="pillbtn primary" id="pickbtn">選一列車</button>
  <button class="pillbtn" id="roambtn" aria-pressed="false" title="每隔一段時間自動換一列車">漫遊</button>
  <button class="pillbtn small" id="speedbtn" title="播放速度（1–4）">1×</button>
</div>

<div id="scrim" hidden></div>
<section id="picker" hidden aria-label="選一列車">
  <header><h3>選一列車</h3><button class="ib" id="pclose" aria-label="關閉">✕</button></header>
  <input id="pq" type="search" placeholder="搜尋車次、車種或車站，例如 152、自強、花蓮" autocomplete="off">
  <div class="tabs" id="ptabs">
    <button data-g="all" aria-pressed="true">全部</button>
    <button data-g="tra" aria-pressed="false">台鐵</button>
    <button data-g="hsr" aria-pressed="false">高鐵</button>
    <button data-g="mrt" aria-pressed="false">捷運・輕軌</button>
  </div>
  <div id="plist"></div>
</section>

<section id="settings" hidden aria-label="設定">
  <section>
    <h4>時間</h4>
    <input id="slider" type="range" min="0" max="1439" step="1" aria-label="時間">
    <div class="row" style="margin-top:8px">
      <button id="playbtn">暫停</button>
      <button id="nowbtn" class="primary">回到現在</button>
    </div>
  </section>
  <section>
    <h4>畫面</h4>
    <div class="row">
      <button id="terrainbtn" aria-pressed="true">3D 地形</button>
      <button id="buildbtn" aria-pressed="true">建築</button>
      <button id="labelbtn" aria-pressed="true">站名</button>
    </div>
  </section>
  <section>
    <h4>TDX 即時資料</h4>
    <div class="note">填入 <a href="https://tdx.transportdata.tw/" target="_blank" rel="noopener">TDX</a> 的 API 金鑰後，台鐵與高鐵改用當日官方時刻表，台鐵每分鐘套用即時誤點。金鑰只存在這台裝置的瀏覽器。</div>
    <label for="tdxid">Client ID</label>
    <input id="tdxid" autocomplete="off" spellcheck="false">
    <label for="tdxsecret">Client Secret</label>
    <input id="tdxsecret" type="password" autocomplete="off" spellcheck="false">
    <div id="tdxstatus">尚未連線</div>
    <div class="row" style="margin-top:8px">
      <button class="primary" id="tdxgo">連線並載入</button>
      <button id="tdxclear">改回班表推估</button>
    </div>
  </section>
  <section>
    <h4>說明</h4>
    <div class="note">空白鍵暫停、1–4 切換速度、←→ 移動 10 分鐘、R 漫遊、F 全螢幕、Esc 離開跟車。軌道與底圖 © OpenStreetMap 貢獻者，地形 © Mapzen／AWS Terrain Tiles，音樂由瀏覽器即時合成。</div>
  </section>
</section>

<div id="intro">
  <div class="in">
    <h2>鐵道脈動</h2>
    <p>此刻，全台有數百列火車正在山海之間奔馳。<br>選一列車，跟著它走一段。</p>
    <div class="btns">
      <button class="pillbtn primary" id="startroam">開始漫遊</button>
      <button class="pillbtn" id="startpick">自己選一列</button>
    </div>
    <small>建議開啟聲音 · 背景音樂可隨時在右上角關閉</small>
  </div>

<script>/* ===== 路網與班表推估引擎 ===== */
const LAT0 = 23.7, LON0 = 120.95;
const KX = 111.32 * Math.cos(LAT0 * Math.PI / 180), KY = 110.57;
const proj = (lat, lon) => [(lon - LON0) * KX, -(lat - LAT0) * KY];
const normName = s => (s || '').replace(/臺/g, '台').replace(/\s/g, '');

const NODES = [];          // {id, sys, name, lat, lon, x, y, lines:Set}
const NODE_BY = new Map(); // `${sys}:${name}` -> node
const ADJ = new Map();     // node.id -> [{to, d}]  (TRA / THSR 圖)

function addNode(sys, name, lat, lon) {
  const key = sys + ':' + name;
  if (NODE_BY.has(key)) return NODE_BY.get(key);
  const [x, y] = proj(lat, lon);
  const n = { id: NODES.length, sys, name, lat, lon, x, y, lines: new Set() };
  NODES.push(n); NODE_BY.set(key, n); ADJ.set(n.id, []);
  return n;
}
for (const sys in STATION_TEXT) {
  for (const row of STATION_TEXT[sys].trim().split('\n')) {
    const [name, lat, lon] = row.split(',');
    addNode(sys, name.trim(), +lat, +lon);
  }
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/* ---------- 真實軌道線形（data/rail.json，由 tools/fetch_rail.py 產生） ---------- */
const SEG = new Map(); // `${sys}:${a}|${b}` -> {pts:[[x,y]], cum:[km], len}
const unproj = (x, y) => [x / KX + LON0, -y / KY + LAT0];
function segGeom(a, b) {
  const g = SEG.get(a.sys + ':' + a.name + '|' + b.name);
  if (g) return { g, rev: false };
  const r = SEG.get(a.sys + ':' + b.name + '|' + a.name);
  return r ? { g: r, rev: true } : null;
}
/* 兩站之間的軌道長度（公里）；沒有線形時用直線乘上彎曲係數 */
function segLen(a, b, curve = 1.12) {
  const s = segGeom(a, b);
  return s ? s.g.len : dist(a, b) * curve;
}
/* 兩站之間比例 p（0~1，依距離）的位置與方向 */
function segPoint(a, b, p) {
  const s = segGeom(a, b);
  if (!s) return { x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p, heading: Math.atan2(b.y - a.y, b.x - a.x) };
  const { pts, cum, len } = s.g;
  let d = (s.rev ? 1 - p : p) * len;
  let lo = 0, hi = cum.length - 1;
  while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= d) lo = mid; else hi = mid; }
  const t = Math.min(1, Math.max(0, (d - cum[lo]) / ((cum[hi] - cum[lo]) || 1)));
  const [x1, y1] = pts[lo], [x2, y2] = pts[hi];
  let hd = Math.atan2(y2 - y1, x2 - x1);
  if (s.rev) hd += Math.PI;
  return { x: x1 + (x2 - x1) * t, y: y1 + (y2 - y1) * t, heading: hd };
}
function applyRailData(data) {
  for (const [key, [lon, lat]] of Object.entries(data.stations || {})) {
    const n = NODE_BY.get(key);
    if (!n) continue;
    n.lon = lon; n.lat = lat; [n.x, n.y] = proj(lat, lon);
  }
  SEG.clear();
  for (const [key, coords] of Object.entries(data.segments || {})) {
    const pts = coords.map(([lon, lat]) => proj(lat, lon));
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    SEG.set(key, { pts, cum, len: cum[cum.length - 1] || 0.001, coords });
  }
  for (const [id, edges] of ADJ) for (const e of edges) e.d = segLen(NODES[id], NODES[e.to]);
  pathCache.clear();
}

for (const L of LINES) {
  L.nodes = L.st.split(' ').map(nm => {
    const n = NODE_BY.get(L.sys + ':' + nm);
    if (!n) throw new Error('缺少車站 ' + L.sys + ' ' + nm);
    n.lines.add(L.label || L.name);
    return n;
  });
  for (let i = 1; i < L.nodes.length; i++) {
    const a = L.nodes[i - 1], b = L.nodes[i], d = dist(a, b);
    if (!ADJ.get(a.id).some(e => e.to === b.id)) { ADJ.get(a.id).push({ to: b.id, d }); ADJ.get(b.id).push({ to: a.id, d }); }
  }
}

function shortestPath(fromId, toId) {
  if (fromId === toId) return [fromId];
  const D = new Map([[fromId, 0]]), P = new Map(), done = new Set();
  const q = [[0, fromId]];
  while (q.length) {
    q.sort((a, b) => a[0] - b[0]);
    const [d, u] = q.shift();
    if (done.has(u)) continue; done.add(u);
    if (u === toId) break;
    for (const e of ADJ.get(u)) {
      const nd = d + e.d;
      if (nd < (D.get(e.to) ?? Infinity)) { D.set(e.to, nd); P.set(e.to, u); q.push([nd, e.to]); }
    }
  }
  if (!P.has(toId)) return null;
  const path = [toId];
  while (path[0] !== fromId) path.unshift(P.get(path[0]));
  return path;
}
const pathCache = new Map();
function cachedPath(a, b) {
  const k = a + '>' + b;
  if (!pathCache.has(k)) pathCache.set(k, shortestPath(a, b));
  return pathCache.get(k);
}
function routeThrough(sys, waypoints) {
  let ids = [];
  for (let i = 1; i < waypoints.length; i++) {
    const a = NODE_BY.get(sys + ':' + waypoints[i - 1]).id, b = NODE_BY.get(sys + ':' + waypoints[i]).id;
    const p = cachedPath(a, b);
    ids = ids.length ? ids.concat(p.slice(1)) : p.slice();
  }
  return ids.map(i => NODES[i]);
}

/* 簡易雜湊亂數，讓每天的推估結果穩定 */
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; }

const TRIPS = [];
const NODE_TRIPS = new Map(); // node.id -> [[trip, idx]]

/* 由車站序列與停站規則產生時刻
   nodes: 經過的車站；stopFn(node,i): 是否停靠；spd: km/h；dwell, acc: 分 */
function buildTimes(nodes, stopFn, t0, spd, dwell, acc, curve = 1.12) {
  const out = []; let t = t0;
  for (let i = 0; i < nodes.length; i++) {
    const stop = i === 0 || i === nodes.length - 1 || stopFn(nodes[i], i);
    if (i > 0) {
      const d = segLen(nodes[i - 1], nodes[i], curve); // 有真實線形時用軌道長度
      let rt = d / spd * 60;
      if (out[i - 1].stop) rt += acc;
      if (stop) rt += acc;
      t += rt;
    }
    const arr = t;
    const dep = (stop && i > 0 && i < nodes.length - 1) ? t + dwell : t;
    out.push({ arr, dep, stop });
    t = dep;
  }
  return out;
}

function registerTrip(trip) {
  trip.idx = TRIPS.length;
  trip.start = trip.times[0].dep;
  trip.end = trip.times[trip.times.length - 1].arr + (trip.delay || 0);
  trip.cum = [0];
  for (let i = 1; i < trip.nodes.length; i++) trip.cum.push(trip.cum[i - 1] + segLen(trip.nodes[i - 1], trip.nodes[i]));
  TRIPS.push(trip);
  trip.nodes.forEach((n, i) => {
    if (!trip.times[i].stop) return;
    if (!NODE_TRIPS.has(n.id)) NODE_TRIPS.set(n.id, []);
    NODE_TRIPS.get(n.id).push([trip, i]);
  });
}

const hm = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };

function simDelay(no, type) {
  const r = hash('d' + no), r2 = hash('e' + no);
  const late = type === '區間' ? 0.30 : 0.42;
  if (r > late) return 0;
  if (r > late * 0.35) return 1 + Math.floor(r2 * 4);
  return 5 + Math.floor(r2 * 16);
}

function genTRA() {
  for (const s of TRA_SERVICES) {
    const T = TRA_TYPES[s.type];
    const fwd = routeThrough('TRA', s.wp), rev = fwd.slice().reverse();
    let k = 0;
    for (const nodes of [fwd, rev]) {
      // 南下（往高雄方向 / 順時針）用奇數車次
      const southbound = nodes[nodes.length - 1].lat < nodes[0].lat;
      const off = nodes === rev ? Math.round(s.hw / 2) : 0;
      let j = 0;
      for (let t = hm(s.from) + off; t <= hm(s.to) + off; t += s.hw, j++) {
        const no = String(s.base + j * 2 + (southbound ? 1 : 0));
        const times = buildTimes(nodes, n => s.stops ? s.stops.has(n.name) : true, t, T.spd, s.type === '區間' ? 0.5 : 1, s.type === '區間' ? 0.5 : 0.9);
        registerTrip({ sys:'TRA', no, type:s.type, color:T.color, car:T.car, nodes, times,
          origin:nodes[0].name, dest:nodes[nodes.length - 1].name, delay:simDelay(no, s.type), live:false });
        k++;
      }
    }
  }
}

/* ---------- 高鐵班表推估 ---------- */
function genTHSR() {
  const all = routeThrough('THSR', ['南港', '左營']);
  const pats = [
    { stops:new Set(['南港','台北','板橋','台中','左營']), off:0, base:100, from:'06:30', to:'21:30', hw:60 },
    { stops:new Set(['南港','台北','板橋','桃園','新竹','台中','嘉義','台南','左營']), off:20, base:600, from:'06:15', to:'22:15', hw:60 },
    { stops:null, off:40, base:500, from:'06:00', to:'22:00', hw:60 },
  ];
  for (const p of pats) {
    for (const nodes of [all, all.slice().reverse()]) {
      const south = nodes === all;
      let j = 0;
      for (let t = hm(p.from) + p.off + (south ? 0 : 7); t <= hm(p.to) + p.off; t += p.hw, j++) {
        const no = String(p.base + j * 2 + (south ? 1 : 0)).padStart(4, '0');
        const times = buildTimes(nodes, n => p.stops ? p.stops.has(n.name) : true, t, 250, 1.5, 1.3, 1.04);
        registerTrip({ sys:'THSR', no, type: p.stops && p.stops.size <= 5 ? '直達' : p.stops ? '跳停' : '每站停',
          color:'#F07F1F', car:'700T', nodes, times, origin:nodes[0].name, dest:nodes[nodes.length - 1].name, delay:0, live:false });
      }
    }
  }
}

/* ---------- 捷運 / 輕軌 ---------- */
function genMRT() {
  for (const L of LINES) {
    if (L.sys === 'TRA' || L.sys === 'THSR') continue;
    const [hwPeak, hwOff] = L.hw;
    for (const nodes of [L.nodes, L.nodes.slice().reverse()]) {
      const startOff = nodes === L.nodes ? 0 : 1.5;
      let t = hm('06:00') + startOff + hash(L.id) * 3, j = 0;
      while (t <= 24 * 60) {
        const h = t / 60;
        const peak = (h >= 7 && h < 9.5) || (h >= 17 && h < 19.5);
        const times = buildTimes(nodes, () => true, t, L.spd, 0.35, 0.15, 1.03);
        registerTrip({ sys:L.sys, no:'', line:L, type:L.label || L.name, color:L.color, car:'', nodes, times,
          origin:nodes[0].name, dest:nodes[nodes.length - 1].name, delay:0, live:false, seq:j++ });
        t += peak ? hwPeak : hwOff;
      }
    }
  }
}

function resetTrips(keep) {
  // keep: 保留的系統（例如以 TDX 取代台鐵時保留其他系統）
  const kept = TRIPS.filter(t => keep && keep(t));
  TRIPS.length = 0; NODE_TRIPS.clear();
  kept.forEach(registerTrip);
}

function generateAll() {
  resetTrips();
  genTRA(); genTHSR(); genMRT();
}

/* ---------- 位置計算 ---------- */
function effTime(trip, i, which) {
  const t = trip.times[i][which];
  if (!trip.delay) return t;
  if (i === 0) return t + Math.round(trip.delay * 0.5);
  return t + trip.delay;
}
function easePos(f, aS, aE) {
  const v = 1 / (1 - (aS + aE) / 2);
  if (aS && f < aS) return v * f * f / (2 * aS);
  if (aE && f > 1 - aE) return 1 - v * (1 - f) * (1 - f) / (2 * aE);
  return v * (f - aS / 2);
}

/* 回傳 {x,y,heading,seg,atStation,nodeIdx} 或 null；m 為「營運日分鐘數」 */
function tripPosAt(trip, m) {
  if (trip.live && trip.liveDelay != null) trip.delay = trip.liveDelay;
  const n = trip.nodes.length;
  const first = effTime(trip, 0, 'dep'), last = effTime(trip, n - 1, 'arr');
  if (m < first || m > last) return null;
  // 二分搜尋所在區段
  let lo = 0, hi = n - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (effTime(trip, mid, 'arr') <= m) lo = mid; else hi = mid - 1;
  }
  const i = lo, a = trip.nodes[i];
  const dep = effTime(trip, i, 'dep');
  if (m <= dep || i === n - 1) {
    const b = trip.nodes[Math.min(i + 1, n - 1)], pa = trip.nodes[Math.max(i - 1, 0)];
    const hd = i < n - 1 ? segPoint(a, b, 0.001).heading : segPoint(pa, a, 0.999).heading;
    return { x:a.x, y:a.y, heading:hd, seg:i, atStation:true, km:trip.cum[i] };
  }
  const b = trip.nodes[i + 1];
  const arr = effTime(trip, i + 1, 'arr');
  const f = Math.min(1, Math.max(0, (m - dep) / Math.max(0.01, arr - dep)));
  const aS = trip.times[i].stop ? 0.2 : 0, aE = trip.times[i + 1].stop ? 0.2 : 0;
  const p = easePos(f, aS, aE);
  const pt = segPoint(a, b, p);
  return { x:pt.x, y:pt.y, heading:pt.heading,
    seg:i, atStation:false, km:trip.cum[i] + (trip.cum[i + 1] - trip.cum[i]) * p, f };
}

/* 營運日：凌晨 0~3 點視為前一營運日的延續 */
function serviceMinute(min) { return min < 180 ? min + 1440 : min; }
function tripPos(trip, min) {
  return tripPosAt(trip, min) || (min < 240 ? tripPosAt(trip, min + 1440) : null);
}

/* ---------- TDX 即時資料（部署於自有網域時可用） ---------- */
const TDX = {
  token: null, exp: 0, status: '未連線', ok: false, lastDelay: null,
  async auth(id, secret) {
    if (this.token && Date.now() < this.exp) return this.token;
    const r = await fetch('https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token', {
      method:'POST', headers:{ 'content-type':'application/x-www-form-urlencoded' },
      body:new URLSearchParams({ grant_type:'client_credentials', client_id:id, client_secret:secret })
    });
    if (!r.ok) throw new Error('金鑰驗證失敗（HTTP ' + r.status + '）');
    const j = await r.json();
    this.token = j.access_token; this.exp = Date.now() + (j.expires_in - 60) * 1000;
    return this.token;
  },
  async get(path, cred) {
    const tk = await this.auth(cred.id, cred.secret);
    const r = await fetch('https://tdx.transportdata.tw/api/basic/' + path + (path.includes('?') ? '&' : '?') + '$format=JSON', {
      headers:{ authorization:'Bearer ' + tk } });
    if (!r.ok) throw new Error('TDX 回應 HTTP ' + r.status);
    return r.json();
  },
  /* 把官方時刻表的停靠站補上中間通過站，轉成引擎用的車次 */
  toTrip(sys, no, typeName, stops) {
    const known = [];
    let prev = -1;
    for (const s of stops) {
      const n = NODE_BY.get(sys + ':' + normName(s.name));
      if (!n) continue;
      let arr = hm(s.arr || s.dep), dep = hm(s.dep || s.arr);
      while (prev >= 0 && arr < prev - 600) arr += 1440;
      while (dep < arr) dep += 1440;
      known.push({ n, arr, dep }); prev = dep;
    }
    if (known.length < 2) return null;
    const nodes = [known[0].n], times = [{ arr:known[0].arr, dep:known[0].dep, stop:true }];
    for (let i = 1; i < known.length; i++) {
      const p = cachedPath(known[i - 1].n.id, known[i].n.id);
      if (!p) return null;
      const seg = p.map(id => NODES[id]);
      let tot = 0; const cum = [0];
      for (let k = 1; k < seg.length; k++) { tot += segLen(seg[k - 1], seg[k]); cum.push(tot); }
      const t0 = known[i - 1].dep, t1 = known[i].arr;
      for (let k = 1; k < seg.length - 1; k++) {
        const t = t0 + (t1 - t0) * (cum[k] / (tot || 1));
        nodes.push(seg[k]); times.push({ arr:t, dep:t, stop:false });
      }
      nodes.push(known[i].n); times.push({ arr:known[i].arr, dep:known[i].dep, stop:true });
    }
    let type = '區間', color, car = '';
    if (sys === 'THSR') { type = '高鐵'; color = '#F07F1F'; car = '700T'; }
    else {
      for (const k of ['普悠瑪','太魯閣','自強','莒光','區間快','區間']) if (typeName.includes(k)) { type = k; break; }
      if (typeName.includes('復興')) type = '莒光';
      color = TRA_TYPES[type].color; car = TRA_TYPES[type].car;
      if (typeName.includes('3000')) car = 'EMU3000';
    }
    return { sys, no, type, typeName, color, car, nodes, times, origin:nodes[0].name, dest:nodes[nodes.length - 1].name,
      delay:0, live:true, liveDelay:null };
  },
  async loadTimetables(cred) {
    const tra = await this.get('v3/Rail/TRA/DailyTrainTimetable/Today', cred);
    const thsr = await this.get('v2/Rail/THSR/DailyTimetable/Today', cred);
    const trips = [];
    for (const t of (tra.TrainTimetables || [])) {
      const info = t.TrainInfo;
      const trip = this.toTrip('TRA', info.TrainNo, (info.TrainTypeName && info.TrainTypeName.Zh_tw) || '',
        t.StopTimes.map(s => ({ name:s.StationName.Zh_tw, arr:s.ArrivalTime, dep:s.DepartureTime })));
      if (trip) trips.push(trip);
    }
    for (const t of (thsr || [])) {
      const info = t.DailyTrainInfo;
      const trip = this.toTrip('THSR', info.TrainNo, '',
        t.StopTimes.map(s => ({ name:s.StationName.Zh_tw, arr:s.ArrivalTime || s.DepartureTime, dep:s.DepartureTime || s.ArrivalTime })));
      if (trip) trips.push(trip);
    }
    if (!trips.length) throw new Error('沒有取得任何班次');
    return trips;
  },
  /* 以官方班次取代台鐵與高鐵的推估班次 */
  applyTimetables(trips) {
    resetTrips(t => t.sys !== 'TRA' && t.sys !== 'THSR');
    trips.forEach(registerTrip);
  },
  async loadDelays(cred, isCurrent = () => true) {
    const j = await this.get('v2/Rail/TRA/LiveTrainDelay', cred);
    if (!isCurrent()) return 0;
    const map = new Map();
    for (const d of j) map.set(String(d.TrainNo), d.DelayTime);
    for (const t of TRIPS) if (t.sys === 'TRA' && t.live) {
      t.liveDelay = map.has(t.no) ? map.get(t.no) : 0;
      t.delay = t.liveDelay;
      t.end = t.times[t.times.length - 1].arr + t.delay;
    }
    this.lastDelay = Date.now();
    return map.size;
  }
};

<script>/* ===== 背景音樂：以 Web Audio 即時合成的抒情鋼琴與和弦鋪底（無版權素材） ===== */
const Music = (() => {
  let ctx = null, master = null, wet = null, timer = null, playing = false;
  let nextChord = 0, nextNote = 0, chordIdx = 0, lastNote = 7;
  const BAR = 8; // 每個和弦秒數
  // Fmaj7 → Em7 → Dm7 → Cmaj7 → Am7 → Dm7 → Gsus → Cmaj7（以 MIDI 音高表示）
  const CHORDS = [
    [41, 57, 60, 64, 69], [40, 55, 59, 62, 67], [38, 53, 57, 60, 65], [36, 52, 55, 59, 64],
    [45, 55, 60, 64, 67], [38, 53, 57, 60, 65], [43, 55, 60, 62, 67], [36, 52, 55, 59, 64],
  ];
  const SCALE = [60, 62, 64, 67, 69, 72, 74, 76, 79, 81]; // C 大調五聲音階
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  function impulse(sec) {
    const len = ctx.sampleRate * sec, buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    return buf;
  }
  function init() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    const rev = ctx.createConvolver(); rev.buffer = impulse(4.5);
    wet = ctx.createGain(); wet.gain.value = 0.55;
    const dry = ctx.createGain(); dry.gain.value = 0.7;
    master.connect(dry); master.connect(rev); rev.connect(wet);
    dry.connect(comp); wet.connect(comp); comp.connect(ctx.destination);
  }
  /* 和弦鋪底：多個微微走音的三角波，經低通濾波，慢起慢收 */
  function pad(notes, t) {
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 0.3;
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.05, t + 2.5);
    g.gain.setValueAtTime(0.05, t + BAR - 1.5);
    g.gain.linearRampToValueAtTime(0, t + BAR + 2.5);
    lp.connect(g); g.connect(master);
    notes.slice(1).forEach(m => [-6, 5].forEach(det => {
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = hz(m); o.detune.value = det;
      o.connect(lp); o.start(t); o.stop(t + BAR + 2.6);
    }));
    // 低音
    const b = ctx.createOscillator(); b.type = 'sine'; b.frequency.value = hz(notes[0]);
    const bg = ctx.createGain(); bg.gain.setValueAtTime(0, t); bg.gain.linearRampToValueAtTime(0.09, t + 1.5); bg.gain.linearRampToValueAtTime(0, t + BAR + 1);
    b.connect(bg); bg.connect(master); b.start(t); b.stop(t + BAR + 1.1);
  }
  /* 鋼琴音色：基音加泛音，快起、指數衰減 */
  function piano(m, t, vel) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16 * vel, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.05 * vel, t + 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.6);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    g.connect(lp); lp.connect(master);
    [[1, 'sine', 1], [2, 'triangle', 0.25], [3, 'sine', 0.08]].forEach(([mul, type, amp]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = hz(m) * mul;
      const og = ctx.createGain(); og.gain.value = amp;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 3.7);
    });
  }
  function schedule() {
    const ahead = ctx.currentTime + 0.4;
    while (nextChord < ahead) {
      const c = CHORDS[chordIdx % CHORDS.length];
      pad(c, nextChord);
      // 每個和弦開頭輕輕撥一次分解和弦
      c.slice(1, 4).forEach((m, i) => piano(m + 12, nextChord + 0.05 + i * 0.22, 0.45));
      nextChord += BAR; chordIdx++;
    }
    while (nextNote < ahead) {
      const chord = CHORDS[(chordIdx - 1 + CHORDS.length) % CHORDS.length];
      if (Math.random() < 0.62) {
        // 旋律在音階上小步移動，偏好和弦音
        let step = Math.round((Math.random() - 0.5) * 4);
        lastNote = Math.max(0, Math.min(SCALE.length - 1, lastNote + step));
        let m = SCALE[lastNote];
        if (Math.random() < 0.4) { const ct = chord.slice(2).map(x => x + 12).sort((a, b) => Math.abs(a - m) - Math.abs(b - m))[0]; m = ct; }
        piano(m, nextNote, 0.55 + Math.random() * 0.35);
      }
      nextNote += [0.6, 0.9, 1.2, 1.2, 1.8][Math.floor(Math.random() * 5)];
    }
  }
  return {
    get playing() { return playing; },
    async start() {
      if (!ctx) init();
      if (ctx.state === 'suspended') await ctx.resume();
      playing = true;
      nextChord = Math.max(nextChord, ctx.currentTime + 0.1); nextNote = Math.max(nextNote, ctx.currentTime + 1.2);
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0.75, ctx.currentTime + 3);
      clearInterval(timer); timer = setInterval(schedule, 120); schedule();
    },
    stop() {
      if (!ctx) return;
      playing = false;
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.5);
      clearInterval(timer);
      setTimeout(() => { if (!playing) ctx.suspend(); }, 1700);
    },
  };
})();
</script>
<script>/* ===== 3D 沉浸式介面 ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('rp.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('rp.' + k, JSON.stringify(v)); } catch {} },
};
const TW = 8 * 3600e3;
const minOfDay = ms => { const d = new Date(ms + TW); return d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60 + d.getUTCMilliseconds() / 60000; };
const dayStart = ms => { const d = new Date(ms + TW); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - TW; };
const fmtHM = m => { m = ((Math.floor(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const sysGroup = sys => SYSTEMS[sys].group;
const DEG = 180 / Math.PI;

/* ---------- 狀態 ---------- */
const S = {
  simMs: Date.now(), speed: 1, playing: true, live: true,
  positions: [], follow: null, followPaused: false, roam: false, roamAt: 0,
  cam: null, flying: false, phase: null, mapReady: false,
  pickGroup: 'all', terrain: store.get('terrain', true), buildings: store.get('buildings', true), labels: store.get('labels', true),
};
const curMin = () => minOfDay(S.simMs);

/* ---------- 底圖配色（依模擬時間切換日夜） ---------- */

/* 漫遊：每隔一段時間換一列車，偏好行駛中、不同系統的列車 */

  plist.innerHTML = shown.length ? shown.map(({ trip: t, pos }) => {
    const ni = nextStopIdx(t, tripMinute(t));
    const where = ni >= 0 ? (pos.atStation && pos.seg === ni ? '停靠 ' : '往 ') + t.nodes[ni].name : '';
    return `<button data-i="${t.idx}"><span class="c" style="background:${t.color}"></span><span class="n">${esc(trainTitle(t))}</span><span class="d">${esc(t.origin)} → ${esc(t.dest)}</span><span class="s">${esc(where)}</span></button>`;
  }).join('') + (rows.length > shown.length ? `<div class="empty">另有 ${rows.length - shown.length} 列，請用搜尋縮小範圍</div>` : '')
    : `<div class="empty">${q ? '目前沒有符合的行駛中列車' : '這個時間沒有行駛中的列車'}</div>`;
}
$('#pickbtn').addEventListener('click', openPicker);
$('#pclose').addEventListener('click', closePicker);
scrim.addEventListener('click', closePicker);
pq.addEventListener('input', renderPicker);
pq.addEventListener('keydown', e => { if (e.key === 'Enter') { const b = plist.querySelector('button[data-i]'); if (b) b.click(); } if (e.key === 'Escape') closePicker(); e.stopPropagation(); });
$('#ptabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.pickGroup = b.dataset.g;
  document.querySelectorAll('#ptabs button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  renderPicker();
});
plist.addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  setRoam(false); follow(TRIPS[+b.dataset.i]);
});

/* ---------- 點地圖 ---------- */
let popup = null;
function onMapClick(e) {
  const box = [[e.point.x - 10, e.point.y - 10], [e.point.x + 10, e.point.y + 10]];
  const hit = map.queryRenderedFeatures(box, { layers: ['train', 'train-halo', 'train-body', 'st-dot'] });
  const tr = hit.find(f => f.layer.id !== 'st-dot');
  if (tr) { setRoam(false); follow(TRIPS[tr.properties.idx]); return; }
  const st = hit.find(f => f.layer.id === 'st-dot');
  if (st) showStation(NODES[st.properties.id]);
}
function showStation(n) {
  const m = curMin(), rows = [];
  for (const [trip, i] of (NODE_TRIPS.get(n.id) || [])) {
    if (i === trip.nodes.length - 1) continue;
    for (const off of [0, 1440]) {
      const dep = effTime(trip, i, 'dep') - off;
      if (dep >= m - 0.5 && dep <= m + 120) rows.push({ trip, dep, sched: trip.times[i].dep - off });
    }
  }
  rows.sort((a, b) => a.dep - b.dep);
  const html = `<div class="pop"><h5>${esc(n.sys === 'THSR' ? '高鐵' + n.name + '站' : n.name)}</h5><div class="sys">${esc(SYSTEMS[n.sys].name)} · ${esc([...n.lines].join('、'))}</div>
    ${rows.slice(0, 6).map(r => { const cd = Math.round(r.dep - m); return `<button data-i="${r.trip.idx}"><span class="c" style="background:${r.trip.color}"></span><span class="t">${fmtHM(r.sched)}</span><span>${esc(r.trip.no ? (r.trip.sys === 'THSR' ? '高鐵 ' : r.trip.type + ' ') + r.trip.no : r.trip.type)} 往${esc(r.trip.dest)}</span><span class="cd">${cd > 0 ? cd + ' 分' : '進站'}</span></button>`; }).join('') || '<div class="sys">接下來 2 小時沒有班次</div>'}</div>`;
  if (popup) popup.remove();
  popup = new maplibregl.Popup({ offset: 12, maxWidth: '300px' }).setLngLat([n.lon, n.lat]).setHTML(html).addTo(map);
  popup.getElement().addEventListener('click', e => {
    const b = e.target.closest('button[data-i]'); if (!b) return;
    const t = TRIPS[+b.dataset.i]; popup.remove();
    if (tripPos(t, curMin())) { setRoam(false); follow(t); }
  });
}

/* ---------- 時間 ---------- */
const SPEEDS = [1, 10, 30, 60];
function setSpeed(sp) { S.speed = sp; if (sp !== 1) S.live = false; S.playing = true; $('#speedbtn').textContent = sp + '×'; renderClock(); }
$('#speedbtn').addEventListener('click', () => setSpeed(SPEEDS[(SPEEDS.indexOf(S.speed) + 1) % SPEEDS.length]));
function setSimMinute(min) { S.simMs = dayStart(Date.now()) + ((min % 1440) + 1440) % 1440 * 60000; S.live = false; updatePositions(); pushTrains(); renderClock(); renderCaption(true); }
function goNow() { S.simMs = Date.now(); S.live = true; setSpeed(1); updatePositions(); pushTrains(); }
function togglePlay() { S.playing = !S.playing; if (!S.playing) S.live = false; renderClock(); }
$('#slider').addEventListener('input', e => setSimMinute(+e.target.value));
$('#playbtn').addEventListener('click', togglePlay);
$('#nowbtn').addEventListener('click', goNow);
function renderClock() {
  const d = new Date(S.simMs + TW);
  $('#clock').textContent = [d.getUTCHours(), d.getUTCMinutes()].map(x => String(x).padStart(2, '0')).join(':') + (S.speed === 1 ? ':' + String(d.getUTCSeconds()).padStart(2, '0') : '');
  $('#mode').textContent = (TDX.ok ? 'TDX 即時' : '班表推估') + (S.live && S.speed === 1 && S.playing ? '' : S.playing ? ` · ${S.speed}× 播放` : ' · 已暫停');
  $('#playbtn').textContent = S.playing ? '暫停' : '播放';
  if (document.activeElement !== $('#slider')) $('#slider').value = Math.floor(curMin());
}

/* ---------- 工具列 ---------- */
$('#roambtn').addEventListener('click', () => setRoam(!S.roam));
$('#overview').addEventListener('click', () => { setRoam(false); unfollow(); if (map) map.flyTo({ ...TAIWAN, duration: 2500 }); });
function toggleFull() { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch {} }
$('#fullbtn').addEventListener('click', toggleFull);
const musicBtn = $('#musicbtn');
function setMusic(on) {
  if (on) Music.start().catch(() => {}); else Music.stop();
  musicBtn.setAttribute('aria-pressed', String(on)); store.set('music', on);
}
musicBtn.addEventListener('click', () => setMusic(!Music.playing));
$('#setbtn').addEventListener('click', () => {
  settings.hidden = !settings.hidden;
  if (!settings.hidden) { closePicker(); const c = store.get('tdx', {}); $('#tdxid').value = c.id || ''; $('#tdxsecret').value = c.secret || ''; }
});
function toggleBtn(id, key, apply) {
  const b = $(id); b.setAttribute('aria-pressed', String(S[key]));
  b.addEventListener('click', () => { S[key] = !S[key]; store.set(key, S[key]); b.setAttribute('aria-pressed', String(S[key])); if (S.mapReady) apply(S[key]); });
}
toggleBtn('#terrainbtn', 'terrain', on => { try { map.setTerrain(on ? { source: 'dem', exaggeration: 1.5 } : null); } catch {} });
toggleBtn('#buildbtn', 'buildings', on => map.setLayoutProperty('buildings', 'visibility', on ? 'visible' : 'none'));
toggleBtn('#labelbtn', 'labels', on => map.setLayoutProperty('st-label', 'visibility', on ? 'visible' : 'none'));

/* ---------- TDX ---------- */
const tdxStatus = msg => { $('#tdxstatus').innerHTML = msg; };
let delayTimer = null, tdxGen = 0;
const twDate = ms => new Date(ms + TW).toISOString().slice(0, 10);
function afterTripsChanged() {
  // 班次重建後 TRIPS 內的物件已換新，跟車對象要找回同一車次
  if (S.follow) {
    const f = S.follow, same = TRIPS.find(t => t.sys === f.sys && t.no && t.no === f.no && t.origin === f.origin);
    if (same) S.follow = same; else unfollow();
  }
  updatePositions(); pushTrains(); renderClock(); renderCaption(true);
}
async function connectTDX(cred, quiet) {
  const gen = ++tdxGen, isCurrent = () => gen === tdxGen;
  clearInterval(delayTimer);
  tdxStatus('連線中…');
  try {
    const trips = await TDX.loadTimetables(cred);
    if (!isCurrent()) return;
    TDX.applyTimetables(trips);
    TDX.ok = true; TDX.date = twDate(Date.now());
    let d = 0; try { d = await TDX.loadDelays(cred, isCurrent); } catch {}
    if (!isCurrent()) return;
    tdxStatus(`已載入 ${trips.length} 班台鐵與高鐵當日時刻，${d} 列台鐵即時誤點。`);
    delayTimer = setInterval(() => {
      const now = Date.now();
      if (twDate(now) !== TDX.date && minOfDay(now) >= 240) { connectTDX(cred, true); return; }
      TDX.loadDelays(cred, isCurrent).catch(() => {});
    }, 60000);
    afterTripsChanged();
  } catch (err) {
    if (!isCurrent()) return;
    TDX.ok = false;
    tdxStatus(err instanceof TypeError ? '無法連到 TDX，請確認網路連線。目前繼續使用班表推估。' : esc(err.message) + '。請確認金鑰正確；目前繼續使用班表推估。');
    if (!quiet) console.warn(err);
  }
}
$('#tdxgo').addEventListener('click', () => {
  const cred = { id: $('#tdxid').value.trim(), secret: $('#tdxsecret').value.trim() };
  if (!cred.id || !cred.secret) { tdxStatus('請填入 Client ID 與 Client Secret。'); return; }
  store.set('tdx', cred); connectTDX(cred);
});
$('#tdxclear').addEventListener('click', () => {
  tdxGen++; store.set('tdx', {}); TDX.ok = false; clearInterval(delayTimer);
  generateAll(); afterTripsChanged(); tdxStatus('已改回班表推估。');
});

/* ---------- 開場 ---------- */
function closeIntro(then) {
  const intro = $('#intro');
  intro.classList.add('out');
  setTimeout(() => { intro.hidden = true; }, 1300);
  if (store.get('music', true)) setMusic(true);
  then();
}
$('#startroam').addEventListener('click', () => closeIntro(() => setRoam(true)));
$('#startpick').addEventListener('click', () => closeIntro(openPicker));

/* ---------- 鍵盤 ---------- */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea') || !$('#intro').hidden && !$('#intro').classList.contains('out')) return;
  if (e.key === ' ') { togglePlay(); e.preventDefault(); }
  else if (['1', '2', '3', '4'].includes(e.key)) setSpeed(SPEEDS[+e.key - 1]);
  else if (e.key === 'ArrowLeft') setSimMinute(curMin() - 10);
  else if (e.key === 'ArrowRight') setSimMinute(curMin() + 10);
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'r' || e.key === 'R') setRoam(!S.roam);
  else if (e.key === 'm' || e.key === 'M') setMusic(!Music.playing);
  else if (e.key === 'Escape') { if (!picker.hidden) closePicker(); else if (!settings.hidden) settings.hidden = true; else { setRoam(false); unfollow(); } }
});

/* ---------- 主迴圈 ---------- */
let last = performance.now(), lastPush = 0, lastUi = 0;
function frame(now) {
  const dt = Math.min(1000, now - last); last = now;
  if (S.playing) { if (S.live && S.speed === 1) S.simMs = Date.now(); else S.simMs += dt * S.speed; }
  if (now - lastPush > 50) {
    updatePositions(); pushTrains(); lastPush = now;
    // 列車抵達終點：漫遊時換下一列
    if (S.roam && S.follow && !S.flying && !tripPos(S.follow, curMin())) { const t = pickRoamTrip(); if (t) follow(t); }
  }
  stepCamera();
  if (S.roam && now > S.roamAt && !S.flying) { S.roamAt = now + ROAM_SEC * 1000; const t = pickRoamTrip(); if (t) follow(t); }
  if (now - lastUi > 500) { lastUi = now; renderClock(); renderCaption(); applyPhase(); if (!picker.hidden && document.activeElement !== pq) renderPicker(); }
  requestAnimationFrame(frame);
}

/* ---------- 啟動 ---------- */
async function boot() {
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 15000);
    const r = await fetch('data/rail.json', { signal: ctl.signal });
    clearTimeout(tm);
    if (r.ok) applyRailData(await r.json());
  } catch (e) { console.warn('軌道線形載入失敗，改用站間直線', e); }
  generateAll();
  initMap();
  updatePositions(); renderClock();
  requestAnimationFrame(t => { last = t; frame(t); });
  const cred = store.get('tdx', {});
  if (cred.id && cred.secret) connectTDX(cred, true);
}
boot();
</script>

</body></html>
