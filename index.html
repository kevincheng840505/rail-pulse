<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鐵道脈動</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 版面：全幅地圖為底，左上品牌與搜尋、左側資訊面板、底部時間軸；手機改為底部抽屜 */
:root {
  --sea:#D9E2E7; --land:#F4F2EC; --land-edge:#C7CBC4; --county:#DAD9D1;
  --ink:#18252E; --muted:#5B6870; --faint:#8C979D;
  --panel:rgba(252,251,248,.94); --panel-solid:#FCFBF8; --line:rgba(24,37,46,.12);
  --track:#7C8893; --accent:#0E6E8A; --accent-ink:#FFFFFF;
  --ok:#1E8E5A; --warn:#C77A0A; --bad:#C8372D; --gold:#C99A1C;
  --label-halo:rgba(244,242,236,.92);
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --shadow:0 6px 24px rgba(20,30,40,.14),0 1px 3px rgba(20,30,40,.08);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sea:#071017; --land:#17222D; --land-edge:#2A3947; --county:#1A2530;
  --ink:#E4ECF1; --muted:#8E9DA8; --faint:#62717C;
  --panel:rgba(14,21,29,.92); --panel-solid:#0E151D; --line:rgba(228,236,241,.1);
  --track:#4E5E6C; --accent:#4CC4DE; --accent-ink:#06222B;
  --ok:#3DD68C; --warn:#F2B13A; --bad:#FF6B5E; --gold:#F2C94C;
  --label-halo:rgba(8,16,23,.85);
  --shadow:0 8px 30px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
  color-scheme:dark;
} }
:root[data-theme="dark"] {
  --sea:#071017; --land:#17222D; --land-edge:#2A3947; --county:#1A2530;
  --ink:#E4ECF1; --muted:#8E9DA8; --faint:#62717C;
  --panel:rgba(14,21,29,.92); --panel-solid:#0E151D; --line:rgba(228,236,241,.1);
  --track:#4E5E6C; --accent:#4CC4DE; --accent-ink:#06222B;
  --ok:#3DD68C; --warn:#F2B13A; --bad:#FF6B5E; --gold:#F2C94C;
  --label-halo:rgba(8,16,23,.85);
  --shadow:0 8px 30px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
  color-scheme:dark;
}
[hidden] { display:none !important; }
html, body { height:100%; }
body { background:var(--sea); color:var(--ink); font-family:var(--font-body); overflow:hidden; -webkit-font-smoothing:antialiased; }
#map { position:fixed; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; display:block; }
#map.dragging { cursor:grabbing; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.glass { background:var(--panel); backdrop-filter:blur(14px) saturate(1.3); -webkit-backdrop-filter:blur(14px) saturate(1.3); border:1px solid var(--line); box-shadow:var(--shadow); }

/* 頂部 */
#top { position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); left:max(12px, env(safe-area-inset-left,0px)); right:max(12px, env(safe-area-inset-right,0px));
  display:flex; gap:10px; align-items:flex-start; pointer-events:none; z-index:5; }
#top > * { pointer-events:auto; }
.brand { display:flex; align-items:center; gap:10px; padding:8px 14px 8px 10px; border-radius:14px; }
.brand-mark { width:30px; height:30px; flex:none; }
.brand h1 { margin:0; font-size:17px; font-weight:900; letter-spacing:.06em; line-height:1.1; }
.brand small { display:block; font-size:10.5px; color:var(--muted); letter-spacing:.08em; font-weight:500; }
.toolbar { display:flex; gap:6px; align-items:center; padding:6px; border-radius:14px; flex-wrap:wrap; }
.seg { display:flex; background:var(--line); border-radius:10px; padding:2px; }
.seg button { border:0; background:transparent; padding:6px 11px; border-radius:8px; font-size:13px; font-weight:700; color:var(--muted); }
.seg button[aria-pressed="true"] { background:var(--panel-solid); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.15); }
.search { position:relative; }
.search input { width:220px; border:1px solid var(--line); background:var(--panel-solid); border-radius:10px; padding:7px 10px 7px 30px; font-size:13px; }
.search svg { position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--faint); }
#results { position:absolute; top:calc(100% + 6px); left:0; width:300px; max-height:360px; overflow:auto; border-radius:12px; padding:4px; z-index:20; }
#results button { display:flex; width:100%; gap:8px; align-items:center; text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:8px; font-size:13px; }
#results button:hover, #results button.on { background:var(--line); }
#results .k { font-size:11px; color:var(--muted); margin-left:auto; white-space:nowrap; }
select.county { border:1px solid var(--line); background:var(--panel-solid); border-radius:10px; padding:6px 8px; font-size:13px; }
.iconbtn { border:1px solid var(--line); background:var(--panel-solid); border-radius:10px; width:34px; height:32px; display:grid; place-items:center; font-size:15px; }
.spacer { flex:1; }
.right-tools { display:flex; gap:6px; padding:6px; border-radius:14px; }

/* 資訊面板 */
#panel { position:fixed; left:max(12px, env(safe-area-inset-left,0px)); top:calc(env(safe-area-inset-top,0px) + 80px); bottom:calc(env(safe-area-inset-bottom,0px) + 86px);
  width:340px; border-radius:16px; z-index:4; display:flex; flex-direction:column; overflow:hidden; }
#panel .head { padding:14px 16px 10px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:flex-start; }
#panel .head .grow { flex:1; min-width:0; }
#panel .body { overflow:auto; padding:12px 16px 16px; flex:1; min-height:0; }
#panel h2 { margin:0; font-size:20px; font-weight:900; letter-spacing:.02em; text-wrap:balance; }
.sub { color:var(--muted); font-size:12.5px; margin-top:3px; }
.close { border:0; background:var(--line); border-radius:8px; width:28px; height:28px; font-size:14px; flex:none; }
.handle { display:none; }
.eyebrow { font-size:11px; letter-spacing:.12em; color:var(--muted); font-weight:700; margin:14px 0 8px; }
.eyebrow:first-child { margin-top:0; }
.clock { font-family:var(--font-mono); font-size:34px; font-weight:700; letter-spacing:.02em; font-variant-numeric:tabular-nums; line-height:1; }
.mode { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--line); color:var(--muted); }
.mode .dot { width:7px; height:7px; border-radius:50%; background:var(--warn); }
.mode.live .dot { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.stat { padding:10px; border-radius:12px; background:var(--line); }
.stat b { display:block; font-family:var(--font-mono); font-size:22px; font-variant-numeric:tabular-nums; }
.stat span { font-size:11.5px; color:var(--muted); }
.meter { height:8px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:6px; }
.meter i { display:block; height:100%; background:var(--ok); border-radius:99px; }
.row { display:flex; align-items:center; gap:8px; padding:8px 6px; border-radius:10px; font-size:13px; border:0; background:transparent; width:100%; text-align:left; }
button.row:hover { background:var(--line); }
.pill { font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; color:#fff; white-space:nowrap; flex:none; }
.no { font-family:var(--font-mono); font-weight:700; font-variant-numeric:tabular-nums; min-width:42px; }
.tm { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.late { color:var(--bad); font-weight:700; }
.ontime { color:var(--ok); font-weight:700; }
.minor { color:var(--warn); font-weight:700; }
.dest { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cd { font-family:var(--font-mono); font-size:12px; color:var(--muted); white-space:nowrap; }
.legend { display:grid; grid-template-columns:1fr 1fr; gap:6px 12px; font-size:12px; }
.legend span { display:flex; align-items:center; gap:6px; }
.legend i { width:14px; height:6px; border-radius:3px; flex:none; }
.note { font-size:11.5px; color:var(--muted); line-height:1.6; }
.note a { color:var(--accent); }
.board { display:flex; flex-direction:column; }
.board .row { border-bottom:1px solid var(--line); border-radius:0; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
.tabs button { border:1px solid var(--line); background:transparent; border-radius:999px; padding:3px 10px; font-size:12px; }
.tabs button[aria-pressed="true"] { background:var(--ink); color:var(--panel-solid); border-color:var(--ink); }
.fav { border:0; background:transparent; font-size:20px; line-height:1; color:var(--faint); padding:2px; }
.fav.on { color:var(--gold); }
.stops { position:relative; margin:4px 0 0; padding:0; list-style:none; }
.stops li { display:grid; grid-template-columns:18px 1fr auto auto; gap:8px; align-items:center; padding:6px 0; font-size:13px; }
.stops li .bul { width:10px; height:10px; border-radius:50%; border:2px solid var(--faint); background:var(--panel-solid); justify-self:center; position:relative; z-index:1; }
.stops li.past { color:var(--faint); }
.stops li.past .bul { background:var(--faint); border-color:var(--faint); }
.stops li.cur .bul { border-color:var(--accent); background:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
.stops li.cur { font-weight:700; }
.stops::before { content:""; position:absolute; left:8px; top:12px; bottom:12px; width:2px; background:var(--line); }
.kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13px; }
.kv dt { color:var(--muted); }
.kv dd { margin:0; font-weight:500; }
.btn { border:1px solid var(--line); background:var(--panel-solid); border-radius:10px; padding:7px 12px; font-size:13px; font-weight:700; }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.nextbox { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; padding:12px; border-radius:12px; background:var(--line); margin-top:10px; }
.nextbox b { font-size:18px; }
.nextbox .tm { font-size:22px; font-weight:700; }

/* 時間軸 */
#timeline { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 12px); z-index:5;
  display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:16px; width:min(760px, calc(100% - 24px)); }
#play { width:38px; height:38px; border-radius:50%; border:0; background:var(--ink); color:var(--panel-solid); font-size:14px; flex:none; }
#tlabel { font-family:var(--font-mono); font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; min-width:70px; }
#slider { flex:1; min-width:60px; accent-color:var(--accent); }
.speeds { display:flex; gap:2px; background:var(--line); border-radius:9px; padding:2px; flex:none; }
.speeds button { border:0; background:transparent; padding:5px 8px; border-radius:7px; font-size:12px; font-weight:700; font-family:var(--font-mono); color:var(--muted); }
.speeds button[aria-pressed="true"] { background:var(--panel-solid); color:var(--ink); }
#nowbtn { border:0; background:var(--accent); color:var(--accent-ink); border-radius:9px; padding:6px 10px; font-size:12px; font-weight:700; flex:none; }
#nowbtn[hidden] { display:none; }
#recenter { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 78px); z-index:5; border-radius:999px; padding:8px 14px; font-weight:700; font-size:13px; border:0; background:var(--ink); color:var(--panel-solid); box-shadow:var(--shadow); }

/* 對話框 */
#dlg { position:fixed; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.35); z-index:30; padding:16px; }
#dlg .card { width:min(460px,100%); border-radius:16px; padding:20px; background:var(--panel-solid); }
#dlg h3 { margin:0 0 6px; font-size:18px; }
#dlg label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; font-weight:700; }
#dlg input { width:100%; box-sizing:border-box; border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:9px 10px; font-size:14px; }
#tdxstatus { font-size:12.5px; margin-top:12px; padding:10px; border-radius:10px; background:var(--line); line-height:1.6; }
.keys { font-size:12px; color:var(--muted); display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin-top:6px; }
kbd { font-family:var(--font-mono); font-size:11px; border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; background:var(--panel); }

@media (max-width: 760px) {
  .brand small { display:none; }
  .brand { padding:6px 10px 6px 8px; }
  .brand h1 { font-size:15px; }
  #top { flex-wrap:wrap; gap:6px; }
  .toolbar { order:3; width:100%; box-sizing:border-box; }
  .search { flex:1; min-width:0; }
  .search input { width:100%; box-sizing:border-box; }
  #results { width:100%; }
  select.county { max-width:96px; }
  #panel { left:0; right:0; width:auto; top:auto; bottom:0; max-height:46%; border-radius:18px 18px 0 0;
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 70px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); }
  #panel.collapsed { max-height:132px; }
  .handle { display:block; width:40px; height:5px; border-radius:3px; background:var(--faint); margin:8px auto 0; opacity:.6; border:0; padding:0; }
  #panel .head { padding-top:8px; }
  #timeline { width:calc(100% - 16px); gap:6px; padding:6px 8px; bottom:calc(env(safe-area-inset-bottom,0px) + 8px); }
  #tlabel { min-width:58px; font-size:14px; }
  .speeds button { padding:5px 6px; }
  #recenter { bottom:auto; top:calc(env(safe-area-inset-top,0px) + 112px); }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

</head><body>
<canvas id="map" aria-label="全台鐵道即時地圖"></canvas>

<header id="top">
  <div class="brand glass">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="1" y="1" width="30" height="30" rx="9" fill="var(--ink)"/>
      <path d="M8 23 C 12 9, 20 9, 24 23" stroke="var(--panel-solid)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M8 23 C 12 9, 20 9, 24 23" stroke="var(--accent)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-dasharray="3 4"/>
      <circle cx="16" cy="12.6" r="2.6" fill="#F07F1F"/>
    </svg>
    <div><h1>鐵道脈動</h1><small>全台鐵道即時軌跡</small></div>
  </div>
  <div class="toolbar glass">
    <div class="seg" role="group" aria-label="篩選鐵路系統">
      <button data-sys="all" aria-pressed="true" title="所有系統">全</button>
      <button data-sys="tra" aria-pressed="false" title="台鐵">台鐵</button>
      <button data-sys="hsr" aria-pressed="false" title="台灣高鐵">高鐵</button>
      <button data-sys="mrt" aria-pressed="false" title="捷運與輕軌">捷運</button>
    </div>
    <div class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋車站、車次或車種（如 自強、152）" autocomplete="off" aria-label="搜尋路線或車站">
      <div id="results" class="glass" hidden></div>
    </div>
    <select id="county" class="county" aria-label="跳到縣市"><option value="">縣市</option></select>
  </div>
  <div class="spacer"></div>
  <div class="right-tools glass">
    <button class="iconbtn" id="themebtn" title="切換亮暗主題" aria-label="切換亮暗主題">◐</button>
    <button class="iconbtn" id="fullbtn" title="全螢幕（F）" aria-label="全螢幕">⛶</button>
    <button class="iconbtn" id="setbtn" title="資料來源設定" aria-label="資料來源設定">⚙</button>
  </div>
</header>

<aside id="panel" class="glass" aria-live="polite"></aside>
<button id="recenter" hidden>◉ 回到列車</button>

<div id="timeline" class="glass">
  <button id="play" aria-label="暫停">❚❚</button>
  <span id="tlabel">--:--</span>
  <input id="slider" type="range" min="0" max="1439" step="1" value="0" aria-label="時間">
  <div class="speeds" role="group" aria-label="播放速度">
    <button data-sp="1" aria-pressed="true">1×</button>
    <button data-sp="10" aria-pressed="false">10×</button>
    <button data-sp="30" aria-pressed="false">30×</button>
    <button data-sp="60" aria-pressed="false">60×</button>
  </div>
  <button id="nowbtn" hidden>現在</button>
</div>

<div id="dlg" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="dlgt">
    <h3 id="dlgt">資料來源設定</h3>
    <div class="note">預設依各營運單位班型推估列車位置。填入交通部 <a href="https://tdx.transportdata.tw/" target="_blank" rel="noopener">TDX 運輸資料流通服務</a> 的 API 金鑰後，台鐵與高鐵會改用當日官方時刻表，台鐵每分鐘套用即時誤點。金鑰只存在這台裝置的瀏覽器。</div>
    <label for="tdxid">Client ID</label>
    <input id="tdxid" autocomplete="off" spellcheck="false">
    <label for="tdxsecret">Client Secret</label>
    <input id="tdxsecret" type="password" autocomplete="off" spellcheck="false">
    <div id="tdxstatus">尚未連線</div>
    <div class="btnrow">
      <button class="btn primary" id="tdxgo">連線並載入</button>
      <button class="btn" id="tdxclear">改回班表推估</button>
      <span class="spacer"></span>
      <button class="btn" id="dlgclose">關閉</button>
    </div>
    <div class="eyebrow" style="margin-top:18px">快捷鍵</div>
    <div class="keys">
      <span><kbd>空白</kbd></span><span>暫停 / 播放</span>
      <span><kbd>1</kbd>–<kbd>4</kbd></span><span>速度 1× / 10× / 30× / 60×</span>
      <span><kbd>←</kbd> <kbd>→</kbd></span><span>時間 ±10 分</span>
      <span><kbd>F</kbd></span><span>全螢幕</span>
      <span><kbd>Esc</kbd></span><span>關閉卡片</span>
    </div>

<script>/* ===== 路網與班表推估引擎 ===== */
const LAT0 = 23.7, LON0 = 120.95;
const KX = 111.32 * Math.cos(LAT0 * Math.PI / 180), KY = 110.57;
const proj = (lat, lon) => [(lon - LON0) * KX, -(lat - LAT0) * KY];
const normName = s => (s || '').replace(/臺/g, '台').replace(/\s/g, '');

const NODES = [];          // {id, sys, name, lat, lon, x, y, lines:Set}
const NODE_BY = new Map(); // `${sys}:${name}` -> node
const ADJ = new Map();     // node.id -> [{to, d}]  (TRA / THSR 圖)

function addNode(sys, name, lat, lon) {
  const key = sys + ':' + name;
  if (NODE_BY.has(key)) return NODE_BY.get(key);
  const [x, y] = proj(lat, lon);
  const n = { id: NODES.length, sys, name, lat, lon, x, y, lines: new Set() };
  NODES.push(n); NODE_BY.set(key, n); ADJ.set(n.id, []);
  return n;
}
for (const sys in STATION_TEXT) {
  for (const row of STATION_TEXT[sys].trim().split('\n')) {
    const [name, lat, lon] = row.split(',');
    addNode(sys, name.trim(), +lat, +lon);
  }
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

for (const L of LINES) {
  L.nodes = L.st.split(' ').map(nm => {
    const n = NODE_BY.get(L.sys + ':' + nm);
    if (!n) throw new Error('缺少車站 ' + L.sys + ' ' + nm);
    n.lines.add(L.label || L.name);
    return n;
  });
  for (let i = 1; i < L.nodes.length; i++) {
    const a = L.nodes[i - 1], b = L.nodes[i], d = dist(a, b);
    if (!ADJ.get(a.id).some(e => e.to === b.id)) { ADJ.get(a.id).push({ to: b.id, d }); ADJ.get(b.id).push({ to: a.id, d }); }
  }
}

function shortestPath(fromId, toId) {
  if (fromId === toId) return [fromId];
  const D = new Map([[fromId, 0]]), P = new Map(), done = new Set();
  const q = [[0, fromId]];
  while (q.length) {
    q.sort((a, b) => a[0] - b[0]);
    const [d, u] = q.shift();
    if (done.has(u)) continue; done.add(u);
    if (u === toId) break;
    for (const e of ADJ.get(u)) {
      const nd = d + e.d;
      if (nd < (D.get(e.to) ?? Infinity)) { D.set(e.to, nd); P.set(e.to, u); q.push([nd, e.to]); }
    }
  }
  if (!P.has(toId)) return null;
  const path = [toId];
  while (path[0] !== fromId) path.unshift(P.get(path[0]));
  return path;
}
const pathCache = new Map();
function cachedPath(a, b) {
  const k = a + '>' + b;
  if (!pathCache.has(k)) pathCache.set(k, shortestPath(a, b));
  return pathCache.get(k);
}
function routeThrough(sys, waypoints) {
  let ids = [];
  for (let i = 1; i < waypoints.length; i++) {
    const a = NODE_BY.get(sys + ':' + waypoints[i - 1]).id, b = NODE_BY.get(sys + ':' + waypoints[i]).id;
    const p = cachedPath(a, b);
    ids = ids.length ? ids.concat(p.slice(1)) : p.slice();
  }
  return ids.map(i => NODES[i]);
}

/* 簡易雜湊亂數，讓每天的推估結果穩定 */
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; }

const TRIPS = [];
const NODE_TRIPS = new Map(); // node.id -> [[trip, idx]]

/* 由車站序列與停站規則產生時刻
   nodes: 經過的車站；stopFn(node,i): 是否停靠；spd: km/h；dwell, acc: 分 */
function buildTimes(nodes, stopFn, t0, spd, dwell, acc, curve = 1.12) {
  const out = []; let t = t0;
  for (let i = 0; i < nodes.length; i++) {
    const stop = i === 0 || i === nodes.length - 1 || stopFn(nodes[i], i);
    if (i > 0) {
      const d = dist(nodes[i - 1], nodes[i]) * curve; // 軌道彎曲修正
      let rt = d / spd * 60;
      if (out[i - 1].stop) rt += acc;
      if (stop) rt += acc;
      t += rt;
    }
    const arr = t;
    const dep = (stop && i > 0 && i < nodes.length - 1) ? t + dwell : t;
    out.push({ arr, dep, stop });
    t = dep;
  }
  return out;
}

function registerTrip(trip) {
  trip.idx = TRIPS.length;
  trip.start = trip.times[0].dep;
  trip.end = trip.times[trip.times.length - 1].arr + (trip.delay || 0);
  trip.cum = [0];
  for (let i = 1; i < trip.nodes.length; i++) trip.cum.push(trip.cum[i - 1] + dist(trip.nodes[i - 1], trip.nodes[i]));
  TRIPS.push(trip);
  trip.nodes.forEach((n, i) => {
    if (!trip.times[i].stop) return;
    if (!NODE_TRIPS.has(n.id)) NODE_TRIPS.set(n.id, []);
    NODE_TRIPS.get(n.id).push([trip, i]);
  });
}

function simDelay(no, type) {

    const fwd = routeThrough('TRA', s.wp), rev = fwd.slice().reverse();
    let k = 0;
    for (const nodes of [fwd, rev]) {
      // 南下（往高雄方向 / 順時針）用奇數車次
      const southbound = nodes[nodes.length - 1].lat < nodes[0].lat;
      const off = nodes === rev ? Math.round(s.hw / 2) : 0;
      let j = 0;
      for (let t = hm(s.from) + off; t <= hm(s.to) + off; t += s.hw, j++) {
        const no = String(s.base + j * 2 + (southbound ? 1 : 0));
        const times = buildTimes(nodes, n => s.stops ? s.stops.has(n.name) : true, t, T.spd, s.type === '區間' ? 0.5 : 1, s.type === '區間' ? 0.5 : 0.9);
        registerTrip({ sys:'TRA', no, type:s.type, color:T.color, car:T.car, nodes, times,
          origin:nodes[0].name, dest:nodes[nodes.length - 1].name, delay:simDelay(no, s.type), live:false });
        k++;

}

/* ---------- 高鐵班表推估 ---------- */
function genTHSR() {
  const all = routeThrough('THSR', ['南港', '左營']);
  const pats = [
    { stops:new Set(['南港','台北','板橋','台中','左營']), off:0, base:100, from:'06:30', to:'21:30', hw:60 },
    { stops:new Set(['南港','台北','板橋','桃園','新竹','台中','嘉義','台南','左營']), off:20, base:600, from:'06:15', to:'22:15', hw:60 },
    { stops:null, off:40, base:500, from:'06:00', to:'22:00', hw:60 },
  ];
  for (const p of pats) {
    for (const nodes of [all, all.slice().reverse()]) {
      const south = nodes === all;
      let j = 0;
      for (let t = hm(p.from) + p.off + (south ? 0 : 7); t <= hm(p.to) + p.off; t += p.hw, j++) {
        const no = String(p.base + j * 2 + (south ? 1 : 0)).padStart(4, '0');
        const times = buildTimes(nodes, n => p.stops ? p.stops.has(n.name) : true, t, 250, 1.5, 1.3, 1.04);
        registerTrip({ sys:'THSR', no, type: p.stops && p.stops.size <= 5 ? '直達' : p.stops ? '跳停' : '每站停',
          color:'#F07F1F', car:'700T', nodes, times, origin:nodes[0].name, dest:nodes[nodes.length - 1].name, delay:0, live:false });
      }
    }
  }
}

/* ---------- 捷運 / 輕軌 ---------- */
function genMRT() {
  for (const L of LINES) {
    if (L.sys === 'TRA' || L.sys === 'THSR') continue;
    const [hwPeak, hwOff] = L.hw;
    for (const nodes of [L.nodes, L.nodes.slice().reverse()]) {
      const startOff = nodes === L.nodes ? 0 : 1.5;
      let t = hm('06:00') + startOff + hash(L.id) * 3, j = 0;
      while (t <= 24 * 60) {
        const h = t / 60;
        const peak = (h >= 7 && h < 9.5) || (h >= 17 && h < 19.5);
        const times = buildTimes(nodes, () => true, t, L.spd, 0.35, 0.15, 1.03);
        registerTrip({ sys:L.sys, no:'', line:L, type:L.label || L.name, color:L.color, car:'', nodes, times,
          origin:nodes[0].name, dest:nodes[nodes.length - 1].name, delay:0, live:false, seq:j++ });
        t += peak ? hwPeak : hwOff;
      }
    }
  }
}

function resetTrips(keep) {
  // keep: 保留的系統（例如以 TDX 取代台鐵時保留其他系統）
  const kept = TRIPS.filter(t => keep && keep(t));
  TRIPS.length = 0; NODE_TRIPS.clear();
  kept.forEach(registerTrip);
}

function generateAll() {
  resetTrips();
  genTRA(); genTHSR(); genMRT();
}

/* ---------- 位置計算 ---------- */
function effTime(trip, i, which) {
  const t = trip.times[i][which];
  if (!trip.delay) return t;
  if (i === 0) return t + Math.round(trip.delay * 0.5);
  return t + trip.delay;
}
function easePos(f, aS, aE) {
  const v = 1 / (1 - (aS + aE) / 2);
  if (aS && f < aS) return v * f * f / (2 * aS);
  if (aE && f > 1 - aE) return 1 - v * (1 - f) * (1 - f) / (2 * aE);
  return v * (f - aS / 2);
}

/* 回傳 {x,y,heading,seg,atStation,nodeIdx} 或 null；m 為「營運日分鐘數」 */
function tripPosAt(trip, m) {
  if (trip.live && trip.liveDelay != null) trip.delay = trip.liveDelay;
  const n = trip.nodes.length;
  const first = effTime(trip, 0, 'dep'), last = effTime(trip, n - 1, 'arr');
  if (m < first || m > last) return null;
  // 二分搜尋所在區段
  let lo = 0, hi = n - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (effTime(trip, mid, 'arr') <= m) lo = mid; else hi = mid - 1;
  }
  const i = lo, a = trip.nodes[i];
  const dep = effTime(trip, i, 'dep');
  if (m <= dep || i === n - 1) {
    const b = trip.nodes[Math.min(i + 1, n - 1)], pa = trip.nodes[Math.max(i - 1, 0)];
    const hd = i < n - 1 ? Math.atan2(b.y - a.y, b.x - a.x) : Math.atan2(a.y - pa.y, a.x - pa.x);
    return { x:a.x, y:a.y, heading:hd, seg:i, atStation:true, km:trip.cum[i] };
  }
  const b = trip.nodes[i + 1];
  const arr = effTime(trip, i + 1, 'arr');
  const f = Math.min(1, Math.max(0, (m - dep) / Math.max(0.01, arr - dep)));
  const aS = trip.times[i].stop ? 0.2 : 0, aE = trip.times[i + 1].stop ? 0.2 : 0;
  const p = easePos(f, aS, aE);
  return { x:a.x + (b.x - a.x) * p, y:a.y + (b.y - a.y) * p, heading:Math.atan2(b.y - a.y, b.x - a.x),
    seg:i, atStation:false, km:trip.cum[i] + (trip.cum[i + 1] - trip.cum[i]) * p, f };
}

/* 營運日：凌晨 0~3 點視為前一營運日的延續 */
function serviceMinute(min) { return min < 180 ? min + 1440 : min; }
function tripPos(trip, min) {
  return tripPosAt(trip, min) || (min < 240 ? tripPosAt(trip, min + 1440) : null);
}

/* ---------- TDX 即時資料（部署於自有網域時可用） ---------- */
const TDX = {
  token: null, exp: 0, status: '未連線', ok: false, lastDelay: null,
  async auth(id, secret) {
    if (this.token && Date.now() < this.exp) return this.token;
    const r = await fetch('https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token', {
      method:'POST', headers:{ 'content-type':'application/x-www-form-urlencoded' },
      body:new URLSearchParams({ grant_type:'client_credentials', client_id:id, client_secret:secret })
    });
    if (!r.ok) throw new Error('金鑰驗證失敗（HTTP ' + r.status + '）');
    const j = await r.json();
    this.token = j.access_token; this.exp = Date.now() + (j.expires_in - 60) * 1000;
    return this.token;
  },
  async get(path, cred) {
    const tk = await this.auth(cred.id, cred.secret);
    const r = await fetch('https://tdx.transportdata.tw/api/basic/' + path + (path.includes('?') ? '&' : '?') + '$format=JSON', {
      headers:{ authorization:'Bearer ' + tk } });
    if (!r.ok) throw new Error('TDX 回應 HTTP ' + r.status);
    return r.json();
  },
  /* 把官方時刻表的停靠站補上中間通過站，轉成引擎用的車次 */
  toTrip(sys, no, typeName, stops) {
    const known = [];
    let prev = -1;
    for (const s of stops) {
      const n = NODE_BY.get(sys + ':' + normName(s.name));
      if (!n) continue;
      let arr = hm(s.arr || s.dep), dep = hm(s.dep || s.arr);
      while (prev >= 0 && arr < prev - 600) arr += 1440;
      while (dep < arr) dep += 1440;
      known.push({ n, arr, dep }); prev = dep;
    }
    if (known.length < 2) return null;
    const nodes = [known[0].n], times = [{ arr:known[0].arr, dep:known[0].dep, stop:true }];
    for (let i = 1; i < known.length; i++) {
      const p = cachedPath(known[i - 1].n.id, known[i].n.id);
      if (!p) return null;
      const seg = p.map(id => NODES[id]);
      let tot = 0; const cum = [0];
      for (let k = 1; k < seg.length; k++) { tot += dist(seg[k - 1], seg[k]); cum.push(tot); }
      const t0 = known[i - 1].dep, t1 = known[i].arr;
      for (let k = 1; k < seg.length - 1; k++) {
        const t = t0 + (t1 - t0) * (cum[k] / (tot || 1));
        nodes.push(seg[k]); times.push({ arr:t, dep:t, stop:false });
      }
      nodes.push(known[i].n); times.push({ arr:known[i].arr, dep:known[i].dep, stop:true });
    }
    let type = '區間', color, car = '';
    if (sys === 'THSR') { type = '高鐵'; color = '#F07F1F'; car = '700T'; }
    else {
      for (const k of ['普悠瑪','太魯閣','自強','莒光','區間快','區間']) if (typeName.includes(k)) { type = k; break; }
      if (typeName.includes('復興')) type = '莒光';
      color = TRA_TYPES[type].color; car = TRA_TYPES[type].car;
      if (typeName.includes('3000')) car = 'EMU3000';
    }
    return { sys, no, type, typeName, color, car, nodes, times, origin:nodes[0].name, dest:nodes[nodes.length - 1].name,
      delay:0, live:true, liveDelay:null };
  },
  async loadTimetables(cred) {
    const tra = await this.get('v3/Rail/TRA/DailyTrainTimetable/Today', cred);
    const thsr = await this.get('v2/Rail/THSR/DailyTimetable/Today', cred);
    const trips = [];
    for (const t of (tra.TrainTimetables || [])) {
      const info = t.TrainInfo;
      const trip = this.toTrip('TRA', info.TrainNo, (info.TrainTypeName && info.TrainTypeName.Zh_tw) || '',
        t.StopTimes.map(s => ({ name:s.StationName.Zh_tw, arr:s.ArrivalTime, dep:s.DepartureTime })));
      if (trip) trips.push(trip);
    }
    for (const t of (thsr || [])) {
      const info = t.DailyTrainInfo;
      const trip = this.toTrip('THSR', info.TrainNo, '',
        t.StopTimes.map(s => ({ name:s.StationName.Zh_tw, arr:s.ArrivalTime || s.DepartureTime, dep:s.DepartureTime || s.ArrivalTime })));
      if (trip) trips.push(trip);
    }
    if (!trips.length) throw new Error('沒有取得任何班次');
    resetTrips(t => t.sys !== 'TRA' && t.sys !== 'THSR');
    trips.forEach(registerTrip);
    return trips.length;
  },
  async loadDelays(cred) {
    const j = await this.get('v2/Rail/TRA/LiveTrainDelay', cred);
    const map = new Map();
    for (const d of j) map.set(String(d.TrainNo), d.DelayTime);
    for (const t of TRIPS) if (t.sys === 'TRA' && t.live) {
      t.liveDelay = map.has(t.no) ? map.get(t.no) : 0;
      t.delay = t.liveDelay;
      t.end = t.times[t.times.length - 1].arr + t.delay;
    }
    this.lastDelay = Date.now();
    return map.size;
  }
};

    ctx.fillStyle = trip.color; ctx.fill();
    ctx.lineWidth = isSel ? 2.2 : 1.2; ctx.strokeStyle = isSel ? C.ink : C['panel-solid']; ctx.stroke();
    // 車頭
    ctx.beginPath(); ctx.arc(len / 2 - wid / 2, 0, wid * 0.22, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fill();
    ctx.restore();
    if (trip.delay >= 5 && trip.sys === 'TRA' && v.scale > 2.5) {
      ctx.beginPath(); ctx.arc(sx + len / 2, sy - wid, 2.6, 0, Math.PI * 2); ctx.fillStyle = C.bad; ctx.fill();
    }
    if ((v.scale > 9 && trip.no) || isSel) {
      const txt = trip.no ? (trip.sys === 'THSR' ? trip.no : trip.type.slice(0, 2) + ' ' + trip.no) : trip.type;
      labels.push({ text: txt, sx: sx + len / 2 + 4, sy: sy - wid - 2, train: true, color: trip.color, prio: isSel ? 0 : 5 });
    }
  }

  // 標籤（依優先序避讓）
  labels.sort((a, b) => a.prio - b.prio);
  ctx.textBaseline = 'middle';
  for (const lb of labels) {
    if (lb.train) {
      ctx.font = '700 11px ' + getFont('mono');
      const w = ctx.measureText(lb.text).width;
      if (!free(lb.sx - 2, lb.sy - 8, w + 4, 16)) continue;
      halo(lb.text, lb.sx, lb.sy, C.ink);
      continue;
    }
    const n = lb.n;
    const big = n.sys === 'THSR' || MAJOR.has(n.name);
    ctx.font = (big ? '700 ' : '500 ') + (big ? 12.5 : 11.5) + 'px ' + getFont('body');
    const text = n.sys === 'THSR' ? '高鐵' + n.name : n.name;
    const w = ctx.measureText(text).width;
    let x = lb.sx + lb.r + 5, y = lb.sy;
    if (n.sys === 'THSR') { x = lb.sx - lb.r - 5 - w; }
    if (!free(x - 2, y - 8, w + 4, 16)) { x = lb.sx - lb.r - 5 - w; if (!free(x - 2, y - 8, w + 4, 16)) continue; }
    halo(text, x, y, S.favs.has(n.id) ? C.gold : (n.sys === 'THSR' ? '#E0731A' : C.ink));
  }
}
let fontCache = {};
function getFont(kind) {
  if (!fontCache[kind]) fontCache[kind] = getComputedStyle(document.documentElement).getPropertyValue(kind === 'mono' ? '--font-mono' : '--font-body').trim();
  return fontCache[kind];
}
function halo(text, x, y, color) {
  ctx.lineWidth = 3.2; ctx.strokeStyle = C['label-halo']; ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

/* ---------- 時間與迴圈 ---------- */
function curMin() { return minOfDay(S.simMs); }
function updatePositions() {
  const m = curMin();
  S.positions = [];
  for (const trip of TRIPS) {
    const pos = tripPos(trip, m);
    if (pos) S.positions.push({ trip, pos });
  }
}
let lastPanel = 0, lastPos = 0;
function frame(now) {
  const dt = now - S.lastFrame; S.lastFrame = now;
  if (S.playing) {
    if (S.live && S.speed === 1) S.simMs = Date.now();
    else S.simMs += dt * S.speed;
  }
  if (S.anim) {
    const a = S.anim, f = Math.min(1, (now - a.t0) / a.ms), e = 1 - Math.pow(1 - f, 3);
    const ls = Math.log(a.from.scale) + (Math.log(a.to.scale) - Math.log(a.from.scale)) * e;
    S.view.scale = Math.exp(ls);
    S.view.cx = a.from.cx + (a.to.cx - a.from.cx) * e;
    S.view.cy = a.from.cy + (a.to.cy - a.from.cy) * e;
    if (f >= 1) S.anim = null;
  }
  if (now - lastPos > (S.speed > 1 ? 33 : 60) || S.anim) { updatePositions(); lastPos = now; }
  if (S.follow && S.sel && S.sel.kind === 'train' && !S.anim) {
    const p = S.positions.find(p => p.trip === S.sel.trip);
    if (p) { const t = centerOn(p.pos.x, p.pos.y); S.view.cx += (t.cx - S.view.cx) * 0.15; S.view.cy += (t.cy - S.view.cy) * 0.15; }
  }
  draw(now);
  if (now - lastPanel > 1000) { lastPanel = now; renderTimeline(); renderPanel(); }
  requestAnimationFrame(frame);
}

function nextStopIdx(trip, m) {
  for (let i = 0; i < trip.nodes.length; i++) if (trip.times[i].stop && effTime(trip, i, 'arr') >= m) return i;
  return -1;
}
function tripMinute(trip) {
  // 若車次跨午夜，回傳與其時刻表一致的分鐘數
  const m = curMin();
  if (m < 240 && effTime(trip, 0, 'dep') > m + 600) return m + 1440;
  return m;
}
function renderTrain(trip) {
  const m = tripMinute(trip);
  const pos = tripPos(trip, curMin());
  const ni = nextStopIdx(trip, m);
  const stops = trip.nodes.map((n, i) => ({ n, i, t: trip.times[i] })).filter(s => s.t.stop);
  const title = trip.sys === 'THSR' ? `高鐵 ${esc(trip.no)} 次` : trip.no ? `${esc(trip.type)} ${esc(trip.no)} 次` : esc(trip.type);
  const sub = `${esc(trip.origin)} → ${esc(trip.dest)}${trip.car ? '・' + esc(trip.car) : ''}`;
  let status;
  if (!pos) status = effTime(trip, 0, 'dep') > m ? `尚未發車，${fmtHM(effTime(trip, 0, 'dep'))} 自${esc(trip.origin)}出發` : '已抵達終點';
  else if (ni >= 0) {
    const eta = effTime(trip, ni, 'arr');
    const atSt = pos.atStation && trip.nodes[pos.seg] === trip.nodes[ni];
    status = `<div class="nextbox"><div><div class="sub">${atSt ? '停靠中' : '下一站'}</div><b>${esc(trip.nodes[ni].name)}</b></div><div style="text-align:right"><div class="tm">${fmtHM(eta)}</div><div class="cd">${atSt ? '即將發車' : Math.max(0, Math.round(eta - m)) + ' 分後到站'}</div></div></div>`;
  }
  const speed = pos && !pos.atStation && pos.f != null ? estSpeed(trip, pos) : 0;
  setPanel(`${head(title, sub, `<button class="close" data-close aria-label="關閉">✕</button>`)}
  <div class="body">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${pillFor(trip)}${delayText(trip)}${speed ? `<span class="cd">約 ${speed} km/h</span>` : ''}</div>
    ${typeof status === 'string' && !status.startsWith('<') ? `<div class="nextbox"><span>${status}</span></div>` : status || ''}
    <div class="btnrow">
      <button class="btn ${S.follow ? 'primary' : ''}" data-follow>${S.follow ? '跟隨中' : '跟隨列車'}</button>
      ${pos ? '' : `<button class="btn" data-jump>跳到發車時間</button>`}
    </div>
    <div class="eyebrow">停靠站（${stops.length} 站）</div>
    <ol class="stops">
      ${stops.map(s => {
        const arr = effTime(trip, s.i, 'arr'), dep = effTime(trip, s.i, 'dep');
        const cls = dep < m && s.i !== ni ? 'past' : s.i === ni ? 'cur' : '';
        const sched = s.i === 0 ? trip.times[0].dep : trip.times[s.i].arr;
        const showDelay = trip.delay && trip.sys === 'TRA';
        return `<li class="${cls}"><span class="bul"></span><span>${esc(s.n.name)}</span><span class="tm">${fmtHM(sched)}</span><span class="tm ${showDelay ? 'late' : 'cd'}" style="min-width:42px;text-align:right">${showDelay ? fmtHM(s.i === 0 ? dep : arr) : ''}</span></li>`;
      }).join('')}
    </ol>
  </div>`);
}
function estSpeed(trip, pos) {
  const i = pos.seg, a = trip.nodes[i], b = trip.nodes[i + 1];
  const mins = effTime(trip, i + 1, 'arr') - effTime(trip, i, 'dep');
  return Math.round(dist(a, b) * 1.1 / mins * 60);
}

function renderStation(n) {
  const m = curMin();
  const rows = [];
  for (const [trip, i] of (NODE_TRIPS.get(n.id) || [])) {
    if (i === trip.nodes.length - 1) continue; // 終點到站不列入出發
    for (const off of [0, 1440]) {
      const dep = effTime(trip, i, 'dep') - off;
      if (dep >= m - 1 && dep <= m + 180) rows.push({ trip, i, dep, sched: trip.times[i].dep - off });
    }
  }
  rows.sort((a, b) => a.dep - b.dep);
  const isMRT = sysGroup(n.sys) === 'mrt';
  let html;
  if (isMRT) {
    // 依方向（終點）分組
    const groups = new Map();
    for (const r of rows) {
      const k = (r.trip.line ? (r.trip.line.label || r.trip.line.name) : '') + '｜往 ' + r.trip.dest;
      if (!groups.has(k)) groups.set(k, { trip: r.trip, list: [] });
      if (groups.get(k).list.length < 3) groups.get(k).list.push(r);
    }
    html = [...groups.entries()].map(([k, g]) => `<div class="row" style="flex-wrap:wrap;border-bottom:1px solid var(--line);border-radius:0">
      <span class="pill" style="background:${g.trip.color}">${esc(g.trip.type)}</span><b class="dest">往 ${esc(g.trip.dest)}</b>
      <span style="display:flex;gap:10px;width:100%;padding-left:2px">${g.list.map((r, j) => `<button class="btn" style="padding:3px 8px" data-trip="${r.trip.idx}"><span class="tm">${Math.max(0, Math.round(r.dep - m)) || '進站'}${Math.round(r.dep - m) > 0 ? ' 分' : ''}</span></button>`).join('')}</span></div>`).join('') || '<div class="sub">今日營運已結束</div>';
  } else {
    html = rows.slice(0, 16).map(r => {
      const cd = Math.round(r.dep - m);
      return `<button class="row" data-trip="${r.trip.idx}"><span class="tm" style="font-weight:700">${fmtHM(r.sched)}</span><span class="no">${esc(r.trip.no)}</span>${pillFor(r.trip)}<span class="dest">往 ${esc(r.trip.dest)}</span><span style="text-align:right;display:grid;gap:2px">${delayText(r.trip)}<span class="cd">${cd <= 0 ? '即將發車' : cd + ' 分'}</span></span></button>`;
    }).join('') || '<div class="sub">接下來 3 小時沒有停靠班次</div>';
  }
  const lines = [...n.lines].join('、');
  const fav = S.favs.has(n.id);
  // 同名轉乘站（不同系統）
  const transfers = NODES.filter(o => o !== n && (o.name === n.name || (o.name.replace(/車站$/, '') === n.name.replace(/車站$/, ''))) && dist(o, n) < 1.5);
  setPanel(`${head(esc(n.sys === 'THSR' ? '高鐵' + n.name + '站' : n.name), `${esc(SYSTEMS[n.sys].name)}・${esc(lines)}`,
    `<button class="fav ${fav ? 'on' : ''}" data-fav aria-label="${fav ? '取消最愛' : '加入最愛'}" title="${fav ? '取消最愛' : '加入最愛'}">${fav ? '★' : '☆'}</button><button class="close" data-close aria-label="關閉">✕</button>`)}
  <div class="body">
    ${transfers.length ? `<div class="tabs">${transfers.map(o => `<button data-station="${o.id}">轉乘 ${esc(SYSTEMS[o.sys].name)}</button>`).join('')}</div>` : ''}
    <div class="eyebrow">${isMRT ? '下一班列車' : '出發看板・未來 3 小時'}</div>
    <div class="board">${html}</div>
    <div class="note" style="margin-top:12px">${fmtHMS(S.simMs)} 更新${S.live ? '' : '（非即時，時間軸已移動）'}</div>
  </div>`);
}

panel.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.classList.contains('handle')) { panel.classList.toggle('collapsed'); return; }
  if (t.dataset.trip != null) { selectTrain(TRIPS[+t.dataset.trip], true); return; }
  if (t.dataset.station != null) { selectStation(NODES[+t.dataset.station], true); return; }
  if (t.hasAttribute('data-close')) { clearSel(); return; }
  if (t.hasAttribute('data-follow')) { S.follow = !S.follow; $('#recenter').hidden = true; renderPanel(); return; }
  if (t.hasAttribute('data-jump') && S.sel?.trip) { const st = effTime(S.sel.trip, 0, 'dep') % 1440; setSimMinute(st - 1); S.follow = true; renderPanel(); return; }
  if (t.hasAttribute('data-fav') && S.sel?.node) {
    const id = S.sel.node.id; S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id);
    store.set('favs', [...S.favs]); renderPanel();
  }
});

function selectTrain(trip, fly) {

/* ---------- 時間軸 ---------- */
const slider = $('#slider');
function renderTimeline() {
  $('#tlabel').textContent = fmtHMS(S.simMs).slice(0, S.speed > 1 ? 5 : 8);
  if (document.activeElement !== slider) slider.value = Math.floor(curMin());

}

  updatePositions(); renderTimeline(); renderPanel();
}

$('#play').addEventListener('click', togglePlay);
function togglePlay() { S.playing = !S.playing; if (S.playing) S.lastFrame = performance.now(); if (!S.playing) S.live = false; renderTimeline(); }
function setSpeed(sp) { S.speed = sp; if (sp !== 1) S.live = false; S.playing = true; renderTimeline(); }
document.querySelectorAll('.speeds button').forEach(b => b.addEventListener('click', () => setSpeed(+b.dataset.sp)));
$('#nowbtn').addEventListener('click', goNow);
function goNow() { S.simMs = Date.now(); S.live = true; S.speed = 1; S.playing = true; updatePositions(); renderTimeline(); renderPanel(); }

/* ---------- 篩選、搜尋、縣市 ---------- */
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  S.filter = b.dataset.sys;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  store.set('filter', S.filter);
}));
const q = $('#q'), results = $('#results');
let resultItems = [], resultOn = 0;
function search(text) {
  text = normName(text.trim());
  if (!text) return [];
  const out = [];
  const seen = new Set();
  for (const n of NODES) {
    if (n.name.includes(text) && !seen.has(n.sys + n.name)) {
      seen.add(n.sys + n.name);
      out.push({ kind: 'station', node: n, score: n.name === text ? 0 : n.name.startsWith(text) ? 1 : 2, label: n.sys === 'THSR' ? '高鐵' + n.name : n.name, k: SYSTEMS[n.sys].name });
    }
  }
  const m = curMin();
  if (/^\d+$/.test(text)) {
    for (const t of TRIPS) if (t.no && (t.no === text || t.no.replace(/^0+/, '') === text.replace(/^0+/, '')))
      out.push({ kind: 'train', trip: t, score: -1, label: `${t.sys === 'THSR' ? '高鐵' : t.type} ${t.no} 次`, k: `${t.origin} → ${t.dest}` });
    for (const t of TRIPS) if (t.no && t.no.startsWith(text) && t.no !== text && out.length < 30)
      out.push({ kind: 'train', trip: t, score: 3, label: `${t.sys === 'THSR' ? '高鐵' : t.type} ${t.no} 次`, k: `${t.origin} → ${t.dest}` });
  }
  const typeHit = Object.keys(TRA_TYPES).find(k => text.includes(k)) || (/(EMU|TEMU)\d*/i.test(text) ? null : null);
  const carHit = /^T?EMU\d+$/i.test(text) ? text.toUpperCase() : null;
  if (typeHit || carHit || text === '高鐵') {
    for (const { trip } of S.positions) {
      if ((typeHit && trip.type === typeHit) || (carHit && trip.car === carHit) || (text === '高鐵' && trip.sys === 'THSR'))
        out.push({ kind: 'train', trip, score: 4, label: `${trip.sys === 'THSR' ? '高鐵' : trip.type} ${trip.no} 次`, k: `行駛中・往${trip.dest}` });
    }
  }
  return out.sort((a, b) => a.score - b.score).slice(0, 30);
}
function renderResults() {
  if (!resultItems.length) { results.hidden = !q.value.trim(); results.innerHTML = q.value.trim() ? '<div class="sub" style="padding:10px">找不到符合的車站或車次</div>' : ''; return; }
  results.hidden = false;
  results.innerHTML = resultItems.map((r, i) => `<button data-i="${i}" class="${i === resultOn ? 'on' : ''}">${r.kind === 'train' ? pillFor(r.trip) : '<span style="opacity:.6">●</span>'}<span>${esc(r.label)}</span><span class="k">${esc(r.k)}</span></button>`).join('');
}
q.addEventListener('input', () => { resultItems = search(q.value); resultOn = 0; renderResults(); });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { resultOn = Math.min(resultItems.length - 1, resultOn + 1); renderResults(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { resultOn = Math.max(0, resultOn - 1); renderResults(); e.preventDefault(); }
  else if (e.key === 'Enter' && resultItems[resultOn]) pick(resultItems[resultOn]);
  else if (e.key === 'Escape') { q.value = ''; results.hidden = true; q.blur(); }
  e.stopPropagation();
});
results.addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(resultItems[+b.dataset.i]); });
function pick(r) {
  results.hidden = true; q.blur();
  if (r.kind === 'station') selectStation(r.node, true);
  else selectTrain(r.trip, true);
}
document.addEventListener('click', e => { if (!e.target.closest('.search')) results.hidden = true; });

const countySel = $('#county');
for (const name of COUNTY_ORDER) { const c = COUNTIES.find(c => c.name === name); if (c) countySel.insertAdjacentHTML('beforeend', `<option>${name}</option>`); }
countySel.addEventListener('change', () => {
  const c = COUNTIES.find(c => c.name === countySel.value);
  if (c) flyTo(fitBounds(...c.bbox, 80));
  countySel.value = '';
});

/* ---------- 主題、全螢幕、設定 ---------- */
$('#themebtn').addEventListener('click', () => {
  const dark = C.dark;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  store.set('theme', dark ? 'light' : 'dark');
});
{ const t = store.get('theme', null); if (t) document.documentElement.setAttribute('data-theme', t); }
function toggleFull() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } catch {}
}
$('#fullbtn').addEventListener('click', toggleFull);

const dlg = $('#dlg');
$('#setbtn').addEventListener('click', () => { const c = store.get('tdx', {}); $('#tdxid').value = c.id || ''; $('#tdxsecret').value = c.secret || ''; dlg.hidden = false; $('#tdxid').focus(); });
$('#dlgclose').addEventListener('click', () => dlg.hidden = true);
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.hidden = true; });
const tdxStatus = msg => { $('#tdxstatus').innerHTML = msg; };
let delayTimer = null;
async function connectTDX(cred, quiet) {
  tdxStatus('連線中…');
  try {
    const n = await TDX.loadTimetables(cred);
    TDX.ok = true;
    let d = 0; try { d = await TDX.loadDelays(cred); } catch {}
    tdxStatus(`已載入 ${n} 班台鐵與高鐵當日時刻，${d} 列台鐵即時誤點。`);
    clearInterval(delayTimer);
    delayTimer = setInterval(() => TDX.loadDelays(cred).catch(() => {}), 60000);
    if (S.sel && S.sel.kind === 'train') clearSel();
    updatePositions(); renderPanel();
  } catch (err) {
    TDX.ok = false;
    const blocked = err instanceof TypeError;
    tdxStatus(blocked
      ? '無法連到 TDX。若是在 Claude 預覽頁面開啟，安全設定不允許連外，請改用部署在自己網域的版本；若已自架，請確認網路連線。目前繼續使用班表推估。'
      : esc(err.message) + '。請確認金鑰正確；目前繼續使用班表推估。');
    if (!quiet) console.warn(err);
  }
}
$('#tdxgo').addEventListener('click', () => {
  const cred = { id: $('#tdxid').value.trim(), secret: $('#tdxsecret').value.trim() };
  if (!cred.id || !cred.secret) { tdxStatus('請填入 Client ID 與 Client Secret。'); return; }
  store.set('tdx', cred); connectTDX(cred);
});
$('#tdxclear').addEventListener('click', () => {
  store.set('tdx', {}); TDX.ok = false; clearInterval(delayTimer);
  generateAll(); if (S.sel && S.sel.kind === 'train') clearSel();
  updatePositions(); renderPanel(); tdxStatus('已改回班表推估。');
});

/* ---------- 地圖操作 ---------- */
const pointers = new Map();
let dragStart = null, pinchStart = null, moved = false;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  moved = false; S.anim = null;
  if (pointers.size === 1) dragStart = { x: e.clientX, y: e.clientY, cx: S.view.cx, cy: S.view.cy };
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchStart = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), scale: S.view.scale, mid: s2w((a[0] + b[0]) / 2, (a[1] + b[1]) / 2) };
  }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 2 && pinchStart) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, clampScale(pinchStart.scale * d / pinchStart.d) / S.view.scale);
    moved = true; breakFollow();
  } else if (dragStart) {
    const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; cv.classList.add('dragging'); breakFollow(); }
    if (moved) { S.view.cx = dragStart.cx - dx / S.view.scale; S.view.cy = dragStart.cy - dy / S.view.scale; }
  }
});
const endPointer = e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = null;
  if (pointers.size === 1) { const [p] = [...pointers.values()]; dragStart = { x: p[0], y: p[1], cx: S.view.cx, cy: S.view.cy }; }
  if (pointers.size === 0) {
    cv.classList.remove('dragging');
    if (!moved && e.type === 'pointerup') hitTest(e.clientX, e.clientY);
    dragStart = null;
  }
};
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e => {
  e.preventDefault(); S.anim = null;
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)));
}, { passive: false });
cv.addEventListener('dblclick', e => { flyTo({ ...zoomTarget(e.clientX, e.clientY, 2) }, 350); });
const clampScale = s => Math.max(0.8, Math.min(400, s));
function zoomTarget(sx, sy, k) {
  const [wx, wy] = s2w(sx, sy); const ns = clampScale(S.view.scale * k);
  return { scale: ns, cx: wx - (sx - W / 2) / ns, cy: wy - (sy - H / 2) / ns };
}
function zoomAt(sx, sy, k) { Object.assign(S.view, zoomTarget(sx, sy, k)); }
function breakFollow() {
  if (S.follow && S.sel && S.sel.kind === 'train') { S.follow = false; $('#recenter').hidden = false; }
}
$('#recenter').addEventListener('click', () => { S.follow = true; $('#recenter').hidden = true; });

function hitTest(sx, sy) {
  let best = null, bd = 14;
  for (const { trip, pos } of S.positions) {
    if (!visible(trip.sys)) continue;
    const [x, y] = w2s(pos.x, pos.y); const d = Math.hypot(x - sx, y - sy);
    if (d < bd) { bd = d; best = { kind: 'train', trip }; }
  }
  if (!best) {
    bd = 12;
    for (const n of NODES) {
      if (!visible(n.sys)) continue;
      if (sysGroup(n.sys) === 'mrt' && S.view.scale <= 7) continue;
      if (n.sys === 'TRA' && S.view.scale <= 3.5 && !MAJOR.has(n.name)) continue;
      const [x, y] = w2s(n.x, n.y); const d = Math.hypot(x - sx, y - sy);
      if (d < bd) { bd = d; best = { kind: 'station', node: n }; }
    }
  }
  if (!best) return;
  if (best.kind === 'train') selectTrain(best.trip, false);
  else selectStation(best.node, false);
}

/* ---------- 鍵盤 ---------- */
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  if (e.key === ' ') { togglePlay(); e.preventDefault(); }
  else if (['1','2','3','4'].includes(e.key)) setSpeed([1, 10, 30, 60][+e.key - 1]);
  else if (e.key === 'ArrowLeft') setSimMinute(curMin() - 10);
  else if (e.key === 'ArrowRight') setSimMinute(curMin() + 10);
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'Escape') { if (!dlg.hidden) dlg.hidden = true; else clearSel(); }
  else if (e.key === '/') { q.focus(); e.preventDefault(); }
});

/* ---------- 啟動 ---------- */
function boot() {
  resize(); readTheme();
  generateAll();
  S.filter = store.get('filter', 'all');
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.sys === S.filter)));
  const isl = COUNTIES.filter(c => !['澎湖縣','金門縣','連江縣'].includes(c.name));
  const bb = isl.reduce((a, c) => [Math.min(a[0], c.bbox[0]), Math.min(a[1], c.bbox[1]), Math.max(a[2], c.bbox[2]), Math.max(a[3], c.bbox[3])], [1e9, 1e9, -1e9, -1e9]);
  Object.assign(S.view, fitBounds(...bb));
  updatePositions(); renderTimeline(); renderPanel();
  requestAnimationFrame(t => { S.lastFrame = t; frame(t); });
  const cred = store.get('tdx', {});
  if (cred.id && cred.secret) connectTDX(cred, true);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fontCache = {}; });
boot();
</script>
